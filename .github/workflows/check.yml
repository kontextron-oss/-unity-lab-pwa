name: Validate Unity Lab JavaScript
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check analysis module
        run: |
          node --check discovery.js
          node --check fundamentals.js
          node --check analysis.js
          node --check decision-policy.js
          node --check datafeeds.js
          node --check publicfeed.js
          node --check dashboard.js
          node --check intraday.js
          node --check fx.js
          node --check charts.js
          node --check dataquality.js
          node --check depot.js
          node --check depotcsv.js
          node --check home.js
          node --check sw.js
      - name: Check inline application script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('<script>')==1
          Path('/tmp/unity-inline.js').write_text(s.split('<script>')[1].split('</script>')[0])
          assert 'fundamentals.js' in s and 'analysis.js' in s and 'datafeeds.js' in s and 'publicfeed.js' in s and 'dashboard.js' in s and 'charts.js' in s and 'dataquality.js' in s and 'depot.js' in s and 'depotcsv.js' in s and 'home.js' in s and 'intraday.js' in s and 'fx.js' in s
          assert "indexedDB.open('unity-lab',3)" in s
          PY
          node --check /tmp/unity-inline.js

      - name: Test comparative dashboard and missing-data veto
        run: node tests/dashboard.cjs

      - name: Test portfolio ledger and buy-sell details
        run: node tests/depot.cjs

      - name: Test CSV import and validation
        run: node tests/depotcsv.cjs

      - name: Test home dashboard and investment verdict
        run: node tests/home.cjs

      - name: Verify dated quote fallback without a full technical history
        run: node tests/quote-first.cjs

      - name: Test research priority classifications and visible labels
        run: node tests/research-indicator.cjs

      - name: Test automatic UNITY decision result and safeguards
        run: node tests/decision-result.cjs

      - name: Verify simulated portfolio wealth, gains and invested positions
        run: node tests/portfolio-wealth.cjs

      - name: Validate deep yes/no investment decisions and evidence gates
        run: node tests/decision-policy.cjs

      - name: Test new-stock onboarding and automatic local history import
        run: node tests/stock-onboarding.cjs

      - name: Test daily technical pullback alert and stale-data safeguards
        run: node tests/pullback-alert.cjs

      - name: Verify stock removal, archive and safe restoration
        run: node tests/stock-removal.cjs

      - name: Test saved stock order and local simulated trades
        run: node tests/home-actions.cjs

      - name: Test pilot quote timestamp, validation and EOD fallback
        run: node tests/intraday.cjs

      - name: Test automatic ECB FX conversion and stale-rate veto
        run: node tests/fx.cjs

      - name: Test iPhone chart responsiveness, SMA legend and 6-year period
        run: node tests/iphone-chart.cjs

      - name: Test single unified stock list and actions
        run: node tests/unified-watchlist.cjs

      - name: Test Jenoptik stock discovery by name, ticker and ISIN
        run: node tests/jenoptik-search.cjs

      - name: Test worldwide discovery, dynamic history and strict trading veto
        run: node tests/worldwide-discovery.cjs

      - name: Test European financial facts strict validation
        run: python3 -m unittest discover -s tests -p 'test_fundamentals.py'

      - name: Test financial source coverage and UI veto
        run: node tests/fundamentals.cjs
