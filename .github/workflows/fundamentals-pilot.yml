name: Refresh European fundamental filings pilot
on:
  push:
    branches: [main]
    paths:
      - scripts/refresh_fundamentals.py
      - scripts/verify_issuer_pdf.py
      - tests/test_issuer_pdf.py
      - tests/test_fundamentals.py
      - .github/workflows/fundamentals-pilot.yml
  schedule:
    - cron: '35 7 * * 1,4'
  workflow_dispatch:
concurrency:
  group: unity-fundamentals-pilot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-bound PDF reader
        run: python -m pip install --disable-pip-version-check 'pymupdf==1.26.7'
      - name: Validate fundamentals and audited-PDF parser
        run: |
          python -m unittest discover -s tests -p 'test_fundamentals.py'
          python -m unittest discover -s tests -p 'test_issuer_pdf.py'
      - name: Fetch XBRL filings and issuer primary disclosures
        run: python scripts/refresh_fundamentals.py
      - name: Commit snapshot without changing local app data
        run: |
          git config user.name "unity-lab-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json
          if git diff --cached --quiet; then
            echo "No fundamentals changes"
          else
            git commit -m "data: refresh sourced European financial filings [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
