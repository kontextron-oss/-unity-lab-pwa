name: Refresh free ECB euro reference rates
on:
  push:
    branches: [main]
    paths:
      - scripts/refresh_fx.py
      - .github/workflows/fx-rates.yml
  schedule:
    - cron: '45 15 * * 1-5'
  workflow_dispatch:
concurrency:
  group: unity-ecb-fx
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate ECB reference FX
        run: python scripts/refresh_fx.py
      - name: Publish reference rates
        run: |
          git config user.name "unity-lab-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx.json
          if git diff --cached --quiet; then
            echo "No FX update"
          else
            git commit -m "data: update ECB reference FX [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
