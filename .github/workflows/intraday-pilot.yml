name: Pilot European 15m chart bars (unofficial)
on:
  push:
    branches: [main]
    paths:
      - scripts/refresh_intraday.py
      - .github/workflows/intraday-pilot.yml
  schedule:
    - cron: '7,27,47 7-17 * * 1-5'
  workflow_dispatch:
concurrency:
  group: unity-intraday-pilot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pilot extraction
        run: python -m unittest discover -s tests -p 'test_intraday.py'
      - name: Fetch dated 15-minute chart bars
        run: python scripts/refresh_intraday.py
      - name: Commit pilot data without altering daily reference data
        run: |
          git config user.name "unity-lab-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday.json
          if git diff --cached --quiet; then
            echo "No new pilot data"
          else
            git commit -m "data: refresh European pilot bars [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Pilot snapshot published"
                exit 0
              fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
