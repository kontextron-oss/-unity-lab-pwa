name: Verify source-bound annual financial PDF facts (read-only pilot)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/verify_issuer_pdf.py
      - tests/test_issuer_pdf.py
      - .github/workflows/issuer-pdf-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extraction library
        run: python -m pip install --disable-pip-version-check 'pymupdf==1.26.7'
      - name: Test period, issuer, location and ambiguity checks
        run: python -m unittest discover -s tests -p 'test_issuer_pdf.py' -v
      - name: Read only - verify official FY2025 financial statements
        run: python scripts/verify_issuer_pdf.py --probe
