name: Refresh curated delayed market snapshot
on:
  push:
    branches: [main]
    paths:
      - scripts/refresh_market.py
      - .github/workflows/market-data.yml
  schedule:
    - cron: '15 6,10,13,16,19,21,23 * * 1-5'
    - cron: '15 7 * * 6'
  workflow_dispatch:
concurrency:
  group: unity-market-snapshot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh reference prices
        run: python scripts/refresh_market.py
      - name: Commit updated market snapshot
        run: |
          git config user.name "unity-lab-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No market snapshot changes"
          else
            git commit -m "data: refresh delayed reference market snapshot [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Snapshot published"
                exit 0
              fi
              sleep $((attempt * 3))
            done
            echo "Snapshot publication failed after 3 attempts" >&2
            exit 1
          fi
