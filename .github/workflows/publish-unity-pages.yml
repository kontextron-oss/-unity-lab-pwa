name: Publish UNITY to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'unity-017.html'
      - 'update.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '*.js'
      - 'data/**'
      - 'hoerblick/**'
      - 'hoerblick-05-release/**'
      - 'scripts/build-staging.cjs'
      - 'tests/rc17-staging-bundle.cjs'
      - 'tests/rc17-offline-safety.cjs'
      - '.github/workflows/publish-unity-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: unity-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout public UNITY source
        uses: actions/checkout@v4
      - name: Setup Node for deterministic static build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and build public-only static PWA
        run: |
          node tests/rc17-staging-bundle.cjs
          node tests/rc17-offline-safety.cjs
      - name: Restore and compile the isolated HÖRBLICK 0.5 Safari application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hoerblick-05
          base64 -d hoerblick-05-release/client-source.tar.gz.b64 > /tmp/hoerblick-05-source.tar.gz
          printf '%s  %s\\n' 'd9b52637dada4146a1940401df8921d7cd499d703c3af9a49683716a47d3e5f1' /tmp/hoerblick-05-source.tar.gz | sha256sum --check -
          tar -xzf /tmp/hoerblick-05-source.tar.gz -C /tmp/hoerblick-05 --no-same-owner --no-same-permissions
          cd /tmp/hoerblick-05
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/dist/hoerblick-05"
          cp -R dist/. "$GITHUB_WORKSPACE/dist/hoerblick-05/"
          test -s "$GITHUB_WORKSPACE/dist/hoerblick-05/index.html"
          grep -Fq '/-unity-lab-pwa/hoerblick-05/' "$GITHUB_WORKSPACE/dist/hoerblick-05/index.html"
          echo "Isolated Hörblick 0.5 Safari build prepared."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only allowlisted production PWA assets
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static UNITY to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live UNITY 0.17 and update page on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}"
          if [[ -z "$BASE" || "$BASE" != "https://kontextron-oss.github.io/-unity-lab-pwa" ]]; then
            echo "::error::Unexpected Pages target URL: $BASE"
            exit 1
          fi
          for n in {1..10}; do
            echo "Live-site verification attempt ${n}/10"
            if curl -fsSL --connect-timeout 8 --max-time 20 \
              "${BASE}/unity-017.html?release=${GITHUB_SHA}" -o /tmp/unity-017.html \
              && curl -fsSL --connect-timeout 8 --max-time 20 \
              "${BASE}/update.html?release=${GITHUB_SHA}" -o /tmp/unity-update.html \
              && grep -Fq 'Unity Lab 0.17.0 RC1 · Direktstart' /tmp/unity-017.html \
              && grep -Fq 'UNITY_ACTIVATE_UPDATE' /tmp/unity-update.html; then
              echo 'Confirmed: UNITY 0.17 and the safe update helper are live.'
              exit 0
            fi
            sleep 6
          done
          echo '::error::Published website still missing UNITY 0.17 direct start or update page.'
          exit 1


