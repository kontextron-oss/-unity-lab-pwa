name: Publish UNITY to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'unity-017.html'
      - 'update.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '*.js'
      - 'data/**'
      - 'hoerblick/**'
      - 'kontakte/**'
      - 'tests/kontakte-startup.cjs'
      - 'hoerblick-05-release/**'
      - 'hoerblick-original-release/**'
      - 'hoerblick-06-release/**'
      - 'hoerblick-07-release/**'
      - 'hoerblick-08-release/**'
      - 'scripts/build-staging.cjs'
      - 'tests/rc17-staging-bundle.cjs'
      - 'tests/rc17-offline-safety.cjs'
      - '.github/workflows/publish-unity-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: unity-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout public UNITY source
        uses: actions/checkout@v4
      - name: Setup Node for deterministic static build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and build public-only static PWA
        run: |
          node tests/rc17-staging-bundle.cjs
          node tests/rc17-offline-safety.cjs
      - name: Restore and compile the isolated HÖRBLICK 0.5 Safari application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hoerblick-05
          base64 -d hoerblick-05-release/client-source.tar.gz.b64 > /tmp/hoerblick-05-source.tar.gz
          echo 'd9b52637dada4146a1940401df8921d7cd499d703c3af9a49683716a47d3e5f1  /tmp/hoerblick-05-source.tar.gz' | sha256sum --check -
          tar -xzf /tmp/hoerblick-05-source.tar.gz -C /tmp/hoerblick-05 --no-same-owner --no-same-permissions
          cd /tmp/hoerblick-05
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/dist/hoerblick-05"
          cp -R dist/. "$GITHUB_WORKSPACE/dist/hoerblick-05/"
          test -s "$GITHUB_WORKSPACE/dist/hoerblick-05/index.html"
          grep -Fq '/-unity-lab-pwa/hoerblick-05/' "$GITHUB_WORKSPACE/dist/hoerblick-05/index.html"
          echo "Isolated Hörblick 0.5 Safari build prepared."
      - name: Restore original HÖRBLICK pre-circle-button build of 2026-08-25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hoerblick-original-0825
          base64 -d hoerblick-original-release/0825-client-source.tar.gz.b64 > /tmp/hoerblick-original-0825.tar.gz
          echo '189251f5dfb0b1468072defbdeab655696dfe9bf472aba7637ae39b553691cd9  /tmp/hoerblick-original-0825.tar.gz' | sha256sum --check -
          tar -xzf /tmp/hoerblick-original-0825.tar.gz -C /tmp/hoerblick-original-0825 --no-same-owner --no-same-permissions
          cd /tmp/hoerblick-original-0825
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save tailwindcss@4.2.1
          npm run build
          test -s dist/index.html
          grep -Fq '/-unity-lab-pwa/hoerblick-stabil-0825/' dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          mkdir -p "$GITHUB_WORKSPACE/dist/hoerblick-stabil-0825"
          cp -R dist/. "$GITHUB_WORKSPACE/dist/hoerblick-stabil-0825/"
          echo "Isolated original HÖRBLICK 2026-08-25 Safari PWA compiled."
      - name: Restore and build isolated HÖRBLICK 0.6 voice and OCR test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hoerblick-06
          base64 -d hoerblick-06-release/client-source.tar.gz.b64 > /tmp/hoerblick-06-source.tar.gz
          echo 'c1a20575aa160720925efb72ffaf87eba4127950e8c65b54ce82c0c604f6c3e7  /tmp/hoerblick-06-source.tar.gz' | sha256sum --check -
          tar -xzf /tmp/hoerblick-06-source.tar.gz -C /tmp/hoerblick-06 --no-same-owner --no-same-permissions
          cd /tmp/hoerblick-06
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save tailwindcss@4.2.1
          npm run build
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          grep -Fq '/-unity-lab-pwa/hoerblick-06/' dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/dist/hoerblick-06"
          cp -R dist/. "$GITHUB_WORKSPACE/dist/hoerblick-06/"
          echo "HÖRBLICK 0.6 isolated Safari PWA built."
      - name: Restore and publish HÖRBLICK 0.7 camera-first accessible reader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hoerblick-07
          base64 -d hoerblick-06-release/client-source.tar.gz.b64 > /tmp/hoerblick-07-source.tar.gz
          echo 'c1a20575aa160720925efb72ffaf87eba4127950e8c65b54ce82c0c604f6c3e7  /tmp/hoerblick-07-source.tar.gz' | sha256sum --check -
          tar -xzf /tmp/hoerblick-07-source.tar.gz -C /tmp/hoerblick-07 --no-same-owner --no-same-permissions
          node hoerblick-07-release/patch.cjs /tmp/hoerblick-07
          cd /tmp/hoerblick-07
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save tailwindcss@4.2.1
          npm run build
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          grep -Fq '/-unity-lab-pwa/hoerblick-07/' dist/index.html
          test "$(find dist/assets -name '*.js' | wc -l)" -ge 1
          mkdir -p "$GITHUB_WORKSPACE/dist/hoerblick-07"
          cp -R dist/. "$GITHUB_WORKSPACE/dist/hoerblick-07/"
          echo "HÖRBLICK 0.7 camera-first Safari PWA built."
      - name: Build HÖRBLICK 0.8 with better reading order and full-text overview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hoerblick-08
          base64 -d hoerblick-06-release/client-source.tar.gz.b64 > /tmp/hoerblick-08-source.tar.gz
          echo 'c1a20575aa160720925efb72ffaf87eba4127950e8c65b54ce82c0c604f6c3e7  /tmp/hoerblick-08-source.tar.gz' | sha256sum --check -
          tar -xzf /tmp/hoerblick-08-source.tar.gz -C /tmp/hoerblick-08 --no-same-owner --no-same-permissions
          node hoerblick-07-release/patch.cjs /tmp/hoerblick-08
          node hoerblick-08-release/patch.cjs /tmp/hoerblick-08
          cd /tmp/hoerblick-08
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save tailwindcss@4.2.1 esbuild@0.28.2
          ./node_modules/.bin/esbuild "$GITHUB_WORKSPACE/hoerblick-08-release/document-structure.ts" --bundle --platform=node --format=cjs --outfile="$GITHUB_WORKSPACE/hoerblick-08-release/document-structure.cjs"
          node "$GITHUB_WORKSPACE/hoerblick-08-release/test-document-structure.mjs"
          npm run build
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          grep -Fq '/-unity-lab-pwa/hoerblick-08/' dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/dist/hoerblick-08"
          cp -R dist/. "$GITHUB_WORKSPACE/dist/hoerblick-08/"
          echo "HÖRBLICK 0.8 with OCR text reconciliation built."
      - name: Include isolated Kontakte offline PWA
        shell: bash
        run: |
          set -euo pipefail
          node tests/kontakte-startup.cjs
          mkdir -p dist/kontakte
          for file in index.html sw.js manifest.webmanifest icon.svg apple-touch-icon.png; do
            test -s "kontakte/$file"
            cp "kontakte/$file" "dist/kontakte/$file"
          done
          grep -Fq '<title>Kontakte</title>' dist/kontakte/index.html
          grep -Fq 'kontakte-pwa-v07' dist/kontakte/sw.js
          echo 'Kontakte offline PWA included as public-only app; no contact data uploaded.'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only allowlisted production PWA assets
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static UNITY to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live UNITY 0.17 and update page on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}"
          if [[ -z "$BASE" || "$BASE" != "https://kontextron-oss.github.io/-unity-lab-pwa" ]]; then
            echo "::error::Unexpected Pages target URL: $BASE"
            exit 1
          fi
          for n in {1..10}; do
            echo "Live-site verification attempt ${n}/10"
            if curl -fsSL --connect-timeout 8 --max-time 20 \
              "${BASE}/unity-017.html?release=${GITHUB_SHA}" -o /tmp/unity-017.html \
              && curl -fsSL --connect-timeout 8 --max-time 20 \
              "${BASE}/update.html?release=${GITHUB_SHA}" -o /tmp/unity-update.html \
              && curl -fsSL --connect-timeout 8 --max-time 20 \
              "${BASE}/sw.js?release=${GITHUB_SHA}" -o /tmp/unity-sw.js \
              && grep -Fq "then(()=>self.skipWaiting())" /tmp/unity-sw.js \
              && grep -Fq 'Unity Lab 0.17.0 RC1 · Direktstart' /tmp/unity-017.html \
              && grep -Fq 'UNITY_ACTIVATE_UPDATE' /tmp/unity-update.html; then
              echo 'Confirmed: UNITY 0.17 and the safe update helper are live.'
              exit 0
            fi
            sleep 6
          done
          echo '::error::Published website still missing UNITY 0.17 direct start or update page.'
          exit 1


# Restart publication after GitHub Pages source switched to GitHub Actions (2026-11-07).
