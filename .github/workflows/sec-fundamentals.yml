name: Refresh SEC fundamentals snapshot
on:
  push:
    branches: [main]
    paths:
      - scripts/refresh_sec_fundamentals.py
      - tests/test_sec_fundamentals.py
      - scripts/refresh_foresight_outcomes.py
      - scripts/refresh_unity_model_forecasts.py
      - tests/test_unity_model_forecasts.py
      - tests/test_foresight_outcomes.py
      - data/foresight-checkpoints.json
      - .github/workflows/sec-fundamentals.yml
  schedule:
    - cron: '22 8 * * 1-5'
  workflow_dispatch:
concurrency:
  group: unity-sec-fundamentals
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate SEC issuer registry, facts and non-destructive fallback
        run: python -m unittest discover -s tests -p 'test_sec_fundamentals.py'
      - name: Validate source-locked foresight audit and non-destructive revisions
        run: python -m unittest discover -s tests -p 'test_foresight_outcomes.py' -v
      - name: Validate prospective UNITY forecast models and no-lookahead
        run: python -m unittest discover -s tests -p 'test_unity_model_forecasts.py' -v
      - name: Fetch issuer-bound SEC XBRL facts
        run: python scripts/refresh_sec_fundamentals.py
      - name: Audit published FY2026 management forecasts against new annual SEC facts
        run: python scripts/refresh_foresight_outcomes.py
      - name: Update frozen own-model revenue forecasts and future SEC outcome comparisons
        run: python scripts/refresh_unity_model_forecasts.py
      - name: Publish complete source snapshot
        run: |
          git config user.name "unity-lab-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sec-fundamentals.json data/foresight-outcomes.json data/unity-model-forecasts.json
          if git diff --cached --quiet; then
            echo "No SEC fundamentals or foresight audit changes"
          else
            git commit -m "data: refresh SEC fundamentals snapshot [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
