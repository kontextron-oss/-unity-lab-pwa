/* iPhone 15 Pro / Safari PWA: do not let inputs trigger Safari's automatic
   focus zoom (it persists after closing a simulated-order form). */
html{-webkit-text-size-adjust:100%;width:100%;max-width:100%;overflow-x:clip}
body{width:100%;max-width:100%;overflow-x:clip}
input,select,textarea{font-size:16px;min-width:0}
main,#app,.home-detail,.unity-chart-box,.unity-chart-green,.home-stock-item,.home-list,.home-hero{min-width:0;max-width:100%}
#app{overflow-wrap:break-word}
.unity-chart-heading>div{min-width:0;overflow-wrap:anywhere}
.unity-chart-heading>strong{flex-shrink:0;white-space:nowrap}
.unity-chart-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;margin:4px 0 12px;color:#fff}
.unity-chart-legend span{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.unity-legend-line{display:inline-block;width:24px;height:0;border-top:3px solid #fff}
.unity-legend-sma50{border-top:2px dashed #ffe095}
.unity-legend-sma200{border-top:2px dashed #b8e6ff}
@media(max-width:750px){
  header{min-width:0}header>div{min-width:0}header h1{font-size:19px}
  header .status{font-size:11px;max-width:38%;overflow-wrap:anywhere;text-align:right}
  main{width:100%;min-width:0}
  .home-detail{padding:12px}
  .home-detail-title{gap:7px;min-width:0}
  .home-detail-title>div{min-width:0;overflow-wrap:anywhere}
  .home-detail-title h2{font-size:21px;overflow-wrap:anywhere}
  .home-detail-title button{flex-shrink:0;max-width:42%;padding:9px 10px;font-size:13px}
  .unity-chart-green{padding:13px 9px}
  .unity-chart-heading{gap:6px}
  .unity-chart-heading>strong{font-size:17px}
  .unity-chart-heading>div>strong{font-size:17px}
  .unity-range,.unity-chart-green .unity-range{
    display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;
    flex-wrap:nowrap;overflow:visible;border-radius:24px;padding:4px;margin:12px 0;
  }
  .unity-range button,.unity-chart-green .unity-range button{

  .unity-main-chart{width:100%;max-width:100%;height:auto;min-height:0;aspect-ratio:640/300}

function render(){const pages={overview,stocks:stocksView,radar:unityCapitalView,analysis:analysisView,trades:tradesView,backup:backupView};document.getElementById('app').innerHTML=pages[activeTab]();if(activeTab==='backup'&&typeof unityCloudCheck==='function'&&!unityCloudChecked)unityCloudCheck().catch(()=>{});if(activeTab==='radar'&&typeof unityCapitalLoad==='function')unityCapitalLoad().catch(()=>{});if(activeTab==='stocks'){catalogResults();onlineResults=[];onlineRequest++;if(onlineAbort)onlineAbort.abort()}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab))}
async function handleForm(e){if(!e.target.matches('form')||['unity-fund','unity-csv','sell-form'].includes(e.target.id))return;e.preventDefault();const f=e.target, d=Object.fromEntries(new FormData(f));try{if(f.id==='stock-form'){const ticker=d.ticker.trim().toUpperCase();if(cache.instruments.some(x=>x.ticker.toUpperCase()===ticker&&x.exchange.toLowerCase()===d.exchange.trim().toLowerCase()))throw Error('Ticker und Börsenplatz sind bereits vorhanden.');const s={id:id(),name:d.name.trim(),ticker,isin:d.isin.trim().toUpperCase(),exchange:d.exchange.trim(),currency:d.currency,createdAt:new Date().toISOString()};if(!s.name||!s.ticker||!s.exchange)throw Error('Pflichtfelder fehlen.');await put('instruments',s);await audit('STOCK_ADD',s.id,s.ticker)}else if(f.id==='quote-form'){const s=cache.instruments.find(x=>x.id===d.instrumentId);if(!s)throw Error('Aktie fehlt.');const price=parse(d.price),fx=parse(d.fx);if(!(price>0&&fx>0))throw Error('Kurs und FX müssen positiv sein.');if(new Date(d.quotedAt).getTime()>Date.now()+60000)throw Error('Kurszeitpunkt liegt in der Zukunft.');const q={id:id(),instrumentId:s.id,price,fx,quotedAt:new Date(d.quotedAt).toISOString(),createdAt:new Date().toISOString(),source:d.source.trim()||'Manuelle Eingabe',quality:'manual-unverified'};await put('quotes',q);await audit('QUOTE_ADD',q.id,s.ticker)}else if(f.id==='trade-form'){const s=cache.instruments.find(x=>x.id===d.instrumentId);if(!s)throw Error('Aktie fehlt.');const amount=parse(d.amount),price=parse(d.price),fx=parse(d.fx),fee=parse(d.fee||0);if(!(amount>0&&price>0&&fx>0&&fee>=0))throw Error('Betrag, Kurs und FX müssen positiv sein; die Gebühr darf nicht negativ sein.');const decidedAt=new Date(d.decidedAt),executedAt=new Date(d.executedAt);if(!Number.isFinite(decidedAt.getTime())||!Number.isFinite(executedAt.getTime()))throw Error('Datum ungültig.');if(decidedAt>executedAt)throw Error('Die Entscheidung darf nicht nach dem simulierten Kauf liegen.');if(executedAt.getTime()>Date.now()+60000)throw Error('Zukünftige Käufe dürfen nicht als bereits ausgeführt gebucht werden.');const t={id:id(),instrumentId:s.id,decidedAt:decidedAt.toISOString(),executedAt:executedAt.toISOString(),type:'BUY',amount,price,fx,fee,quantity:amount/price,note:d.note.trim(),createdAt:new Date().toISOString()};await put('transactions',t);await audit('BUY_ADD',t.id,s.ticker)}else if(f.id==='strategy-form'){const weights={};for(const k of keys){const v=parse(d[k]);if(!Number.isInteger(v)||v<0||v>100)throw Error('Gewichte müssen ganze Prozentwerte von 0 bis 100 sein.');weights[k]=v}if(Object.values(weights).reduce((a,b)=>a+b,0)!==100)throw Error('Die Gewichte müssen zusammen genau 100 % ergeben.');if(!d.version.trim()||!d.reason.trim())throw Error('Name und Hypothese sind Pflicht.');const mode=e.submitter?.value||'draft';if(mode==='active'&&!confirm('Neue Strategieversion aktivieren? Bisherige Versionen bleiben archiviert.'))return;const s={id:id(),version:d.version.trim(),weights,reason:d.reason.trim(),status:mode==='active'?'active':'draft',createdAt:new Date().toISOString()};if(mode==='active')await deactivateStrategies();await put('strategies',s);await audit('STRATEGY_ADD',s.id,s.version)}await refresh();}catch(err){alert(err.message||String(err))}}
async function deactivateStrategies(){for(const s of cache.strategies.filter(x=>x.status==='active')){await put('strategies',{...s,status:'archived'});await audit('STRATEGY_ARCHIVE',s.id,s.version)}}
async function activateStrategy(sid){const s=cache.strategies.find(x=>x.id===sid&&x.status==='draft');if(!s||!confirm('Diesen Strategieentwurf aktivieren?'))return;await deactivateStrategies();await put('strategies',{...s,status:'active',activatedAt:new Date().toISOString()});await audit('STRATEGY_ACTIVATE',s.id,s.version);await refresh()}
async function voidTrade(tid){const t=cache.transactions.find(x=>x.id===tid&&!x.voidedAt);if(!t)return;if(t.type==='BUY'&&typeof depotActiveTrades==='function'){let n=0;for(const x of depotActiveTrades(t.instrumentId).filter(x=>x.id!==tid)){n+=x.type==='BUY'?Number(x.quantity):-Number(x.quantity);if(n< -1e-8)throw Error('Dieser Kauf kann nicht storniert werden, weil spätere Verkäufe davon abhängen. Bitte zuerst die betreffenden Verkäufe stornieren.')}}if(!confirm('Simulierten '+(t.type==='SELL'?'Verkauf':'Kauf')+' stornieren? Die Buchung bleibt sichtbar.'))return;await put('transactions',{...t,voidedAt:new Date().toISOString()});await audit(t.type==='SELL'?'SELL_VOID':'BUY_VOID',tid,'Storno');await refresh()}
/* Local-first, private snapshot. No pCloud tokens, folder URLs, or
   credentials are stored in the public repository or inside backups.
   The Share Sheet is user-mediated; its completion does NOT prove upload. */
async function unityBackupFile(){
  const payload={format:'unity-lab-backup',schema:3,exportedAt:new Date().toISOString(),data:{}};
  for(const n of STORES){const records=await all(n);payload.data[n]=n==='settings'?records.filter(x=>x?.id!=='unity-lab-incremental-checkpoint-v1'):records;}
  const name='UNITY-LAB-VOLLSICHERUNG_'+payload.exportedAt.replace(/[:.]/g,'-')+'.json';
  const body=JSON.stringify(payload,null,2);
  return new File([body],name,{type:'application/json'});
}
function unityBackupStatus(message){
  const el=document.getElementById('unity-backup-status');
  if(el)el.textContent=message;
}
function unityDownloadBackup(file){
  const u=URL.createObjectURL(file),a=document.createElement('a');
  a.href=u;a.download=file.name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),30000);
}
async function exportBackup(){
  unityBackupStatus('Lokale Sicherungsdatei wird erstellt …');
  const file=await unityBackupFile();
  unityDownloadBackup(file);
  unityBackupStatus('Datei '+file.name+' zum Speichern bereitgestellt. Der Download ist noch keine bestätigte pCloud-Sicherung.');
}
async function unityBackupShare(){
  unityBackupStatus('Vollständige Sicherungsdatei wird erstellt …');
  const file=await unityBackupFile();
  if(typeof navigator!=='undefined'&&typeof navigator.share==='function'&&
    (typeof navigator.canShare!=='function'||navigator.canShare({files:[file]}))){
    try{
      await navigator.share({files:[file],title:'UNITY LAB · Private Datensicherung',
        text:'Vollständige UNITY-LAB-Rückfallebene: bitte in UNITY-LAB/02-VOLLSICHERUNG/ ablegen (nicht in den Änderungssicherungsordner).'});
      unityBackupStatus('Teilen-Menü geschlossen. Bitte in pCloud prüfen, ob '+file.name+' tatsächlich gespeichert wurde.');
      return;
    }catch(e){
      if(e?.name==='AbortError'){
        unityBackupStatus('Teilen abgebrochen. Es wurde keine pCloud-Sicherung bestätigt.');
        return;
      }
      console.warn('Teilen nicht möglich, Download als Alternative',e);
    }
  }
  unityDownloadBackup(file);
  unityBackupStatus('Der iPhone-Teilen-Dialog war nicht verfügbar. Datei wurde als Download bereitgestellt. Bitte anschließend manuell nach pCloud sichern.');
}
async function importBackup(){const file=document.getElementById('import-file')?.files?.[0];if(!file)throw Error('Bitte eine Datei auswählen.');if(file.size>50e6)throw Error('Backup größer als 50 MB. Bitte zunächst eine kleinere Sicherung auswählen.');const obj=JSON.parse(await file.text());if(obj.format!=='unity-lab-backup'||![1,2,3].includes(obj.schema)||!obj.data)throw Error('Ungültiges Unity-Lab-Backup.');const inserts={},replacements={};let count=0,capitalReplacement=null;for(const n of STORES){if(obj.schema<3&&!obj.data[n]&&['fundamentals','histories','analyses','settings'].includes(n))obj.data[n]=[];if(!Array.isArray(obj.data[n]))throw Error('Backup unvollständig: '+n);const existing=new Map(cache[n].map(x=>[x.id,x]));const seen=new Set();inserts[n]=[];replacements[n]=[];for(const item of obj.data[n]){if(!item||typeof item!=='object'||typeof item.id!=='string'||item.id.length>150||seen.has(item.id))throw Error('Ungültige oder doppelte ID in '+n);seen.add(item.id);if(existing.has(item.id)){if(JSON.stringify(existing.get(item.id))!==JSON.stringify(item)){if(n==='settings'&&item.id==='portfolio-capital'){capitalReplacement=item;replacements[n].push(item);count++;}else throw Error('Konflikt bei ID '+item.id+' in '+n+'. Import vollständig abgebrochen.');}}else{inserts[n].push(item);count++}}}if(!count){alert('Keine neuen Datensätze.');return}if(capitalReplacement&&!confirm('Das Backup enthält ein anderes fiktives Grundkapital ('+euro(Number(capitalReplacement.amount))+'). Diesen Backup-Betrag übernehmen und die übrigen Daten ergänzen?'))return;if(!confirm(count+' Datensätze aus dem Backup übernehmen? Aktien und Buchungen werden ergänzt; nur das fiktive Grundkapital kann aus dem Backup ersetzt werden.'))return;await bulkInsert(inserts,replacements);await refresh();alert(count+' Datensätze aus dem Backup übernommen.')}
