ound:white;color:#142638;font:inherit}textarea{min-height:65px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button.primary{background:#164d70;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:650;cursor:pointer}button.secondary{background:#edf2f5;color:#173c55;border:1px solid #cdd9e1;border-radius:8px;padding:10px 13px;cursor:pointer}button.danger{color:#9b2c28;background:#fff2f1;border:1px solid #e8bbb9;border-radius:8px;padding:7px 10px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:570px}th,td{text-align:left;border-bottom:1px solid #e6ebee;padding:11px 8px;vertical-align:top}th{font-size:12px;color:#647581}td.right,th.right{text-align:right}.positive{color:#127044}.negative{color:#aa332d}.pill{display:inline-block;border-radius:20px;background:#eaf0f4;color:#35536a;padding:4px 8px;font-size:12px}.alert{background:#fff3e5;color:#7d501a;padding:12px;border-radius:8px}.status{font-size:12px;color:#cbdce8}.empty{padding:16px;color:#617483;text-align:center}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.weight{display:grid;grid-template-columns:1fr 90px;align-items:center;gap:10px;margin:8px 0}.weight input{text-align:right}.badge{background:#e2edf4;color:#225473;padding:4px 7px;border-radius:7px;font-size:12px}.footer{color:#5d7080;font-size:12px;margin-top:25px}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}form{grid-template-columns:1fr}header{padding:14px 17px}.metric strong{font-size:18px}main{padding:13px 11px 80px}.panel{padding:14px}nav{gap:5px}nav button{padding:10px}}

'use strict';
const STORES=['instruments','quotes','transactions','strategies','audit'];let db,activeTab='overview';let cache={};const keys=['valuation','quality','rr','flows','timing','alternatives'];const labels=['Bewertung / Sicherheitsmarge','Unternehmensqualität','Chance-Risiko / Rendite','Kapitalflüsse','Timing / Katalysatoren','Alternativenvergleich'];const defaults={valuation:30,quality:20,rr:20,flows:15,timing:10,alternatives:5};
// Manuell kuratierter, offline verfügbarer UNITY-Stammdatenkatalog. Keine Kursdaten und kein Live-Abgleich.
const CATALOG=[
{name:'ABB',ticker:'ABBN',isin:'CH0012221716',exchange:'SIX Swiss Exchange',currency:'CHF',group:'Elektrifizierung · Automatisierung'},
{name:'Schneider Electric',ticker:'SU',isin:'FR0000121972',exchange:'Euronext Paris',currency:'EUR',group:'Energiemanagement · Rechenzentren'},

{name:'Siemens Energy',ticker:'ENR',isin:'DE000ENER6Y0',exchange:'Xetra',currency:'EUR',group:'Stromnetze · Energie'},
{name:'Vertiv',ticker:'VRT',isin:'US92537N1081',exchange:'NYSE',currency:'USD',group:'Rechenzentren · Kühlung'},
{name:'Nordex',ticker:'NDX1',isin:'DE000A0D6554',exchange:'Xetra',currency:'EUR',group:'Windenergie'},
{name:'Prysmian',ticker:'PRY',isin:'IT0004176001',exchange:'Borsa Italiana',currency:'EUR',group:'Stromkabel · Netzinfrastruktur'},
{name:'Legrand',ticker:'LR',isin:'FR0010307819',exchange:'Euronext Paris',currency:'EUR',group:'Elektroinstallation · Rechenzentren'},
{name:'Siemens',ticker:'SIE',isin:'DE0007236101',exchange:'Xetra',currency:'EUR',group:'Industrie · Automatisierung'},
{name:'Belimo',ticker:'BEAN',isin:'CH1101098163',exchange:'SIX Swiss Exchange',currency:'CHF',group:'Gebäudetechnik · Energieeffizienz'},
{name:'GE Vernova',ticker:'GEV',isin:'US36828A1016',exchange:'NYSE',currency:'USD',group:'Energietechnik · Stromnetze'},
{name:'nVent Electric',ticker:'NVT',isin:'IE00BDVJJQ56',exchange:'NYSE',currency:'USD',group:'Elektrogehäuse · Verbindungstechnik'},
{name:'Hubbell',ticker:'HUBB',isin:'US4435106079',exchange:'NYSE',currency:'USD',group:'Stromnetze · Netzausrüstung'},
{name:'Quanta Services',ticker:'PWR',isin:'US74762E1029',exchange:'NYSE',currency:'USD',group:'Netzausbau · Infrastruktur'},
{name:'Nexans',ticker:'NEX',isin:'FR0000044448',exchange:'Euronext Paris',currency:'EUR',group:'Stromkabel · Elektrifizierung'}
];
const normalizeSearch=s=>String(s||'').toLocaleLowerCase('de-DE').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
function catalogPresent(s){return cache.instruments.some(x=>(s.isin&&x.isin&&x.isin.toUpperCase()===s.isin)||(x.ticker.toUpperCase()===s.ticker&&x.exchange.toLowerCase()===s.exchange.toLowerCase()))}
function catalogResults(){const target=document.getElementById('catalog-results'),input=document.getElementById('catalog-search');if(!target||!input)return;const term=normalizeSearch(input.value);const matches=CATALOG.map((s,i)=>({s,i})).filter(({s})=>!term||normalizeSearch([s.name,s.ticker,s.isin,s.group,s.exchange].join(' ')).includes(term));let h='<div class="catalog-meta">'+matches.length+' Treffer · fester Offline-Katalog, keine Live-Börsensuche</div>';if(!matches.length)h+='<p class="muted">Kein Treffer im Startkatalog. Unten kannst du die Aktie manuell eintragen.</p>';for(const {s,i} of matches.slice(0,15)){const exists=catalogPresent(s);h+=`<div class="catalog-item"><div><strong>${esc(s.name)} <span class="tiny muted">${esc(s.ticker)}</span></strong><small>${esc(s.isin)} · ${esc(s.exchange)} · ${esc(s.currency)}</small><small>${esc(s.group)}</small></div><button type="button" class="${exists?'secondary':'primary'}" data-catalog="${i}" ${exists?'disabled':''}>${exists?'Vorhanden':'Hinzufügen'}</button></div>`}target.innerHTML=h}
async function addCatalogStock(index){const s=CATALOG[index];if(!s)throw Error('Unbekannter Katalogeintrag.');if(catalogPresent(s))throw Error('Diese Aktie ist bereits in deiner Liste.');const obj={id:id(),name:s.name,ticker:s.ticker,isin:s.isin,exchange:s.exchange,currency:s.currency,createdAt:new Date().toISOString(),catalogSource:'UNITY Offline-Stammdaten 0.1.2'};await put('instruments',obj);await audit('STOCK_CATALOG_ADD',obj.id,s.ticker);await refresh()}
// Erweiterbare, schlüssellose Online-Stammdatensuche. Wikidata ist eine offene Wissensdatenbank,
// keine Börsenstammdaten- oder Kursbestätigung. Treffer werden vor der Übernahme geprüft.
let onlineResults=[],onlineRequest=0,onlineTimer=null,onlineAbort=null;
const WIKI_API='https://www.wikidata.org/w/api.php';
function wikiUrl(params){return WIKI_API+'?'+new URLSearchParams({format:'json',origin:'*',...params}).toString()}
async function wikiFetch(params,signal){const response=await fetch(wikiUrl(params),{signal,credentials:'omit',headers:{Accept:'application/json'}});if(!response.ok)throw Error('Wikidata meldet HTTP '+response.status);const body=await response.json();if(body.error)throw Error(body.error.info||'Wikidata-Fehler');return body}
const claimValue=claim=>claim?.mainsnak?.datavalue?.value;
const claimId=claim=>claimValue(claim)?.id||'';
const claimString=claim=>{const v=claimValue(claim);return typeof v==='string'?v.trim():''};
const activeClaim=claim=>claim&&claim.rank!=='deprecated'&&!claim.qualifiers?.P582?.length;
const uniq=arr=>[...new Set(arr.filter(Boolean))];
const cleanIsin=v=>/^[A-Z]{2}[A-Z0-9]{10}$/.test(v||'')?v:'';
const cleanTicker=v=>/^[A-Za-z0-9.\-^]{1,25}$/.test(v||'')?v.toUpperCase():'';
// Nur bekannte Handelsplätze zuordnen. Handelswährung ist immer ein zu prüfender Vorschlag.
function currencyHint(exchange){const v=normalizeSearch(exchange);if(/new york stock exchange|nasdaq|nyse/.test(v))return 'USD';if(/six swiss|swiss exchange|suisse/.test(v))return 'CHF';if(/xetra|frankfurt|euronext paris|paris stock|borsa italiana|milan stock|deutsche borse/.test(v))return 'EUR';if(/london stock/.test(v))return 'GBP';if(/stockholm/.test(v))return 'SEK';if(/oslo/.test(v))return 'NOK';if(/copenhagen/.test(v))return 'DKK';if(/tokyo stock/.test(v))return 'JPY';return ''}
function wikiListings(entity,searchItem,exchanges){const claims=entity?.claims||{};const activeIsins=uniq((claims.P946||[]).filter(activeClaim).map(claimString).map(cleanIsin));const isin=activeIsins.length===1?activeIsins[0]:'';const name=entity?.labels?.de?.value||entity?.labels?.en?.value||searchItem.label||'';
 const listings=[];
 for(const claim of (claims.P414||[]).filter(activeClaim)){
   const exchangeId=claimId(claim),exchange=exchanges[exchangeId]||'';
   for(const q of (claim.qualifiers?.P249||[])){
     const ticker=cleanTicker(typeof q.datavalue?.value==='string'?q.datavalue.value:'');
     if(ticker)listings.push({name,ticker,isin,exchange,currency:currencyHint(exchange),qid:entity.id,source:'Wikidata',note:searchItem.description||'',ambiguousIsin:activeIsins.length>1});
   }
 }
 // Bei separatem Ticker ohne eindeutige Börsenzuordnung keine Börse erfinden.
 if(!listings.length){for(const claim of (claims.P249||[]).filter(activeClaim)){
   const ticker=cleanTicker(claimString(claim));if(ticker)listings.push({name,ticker,isin,exchange:'',currency:'',qid:entity.id,source:'Wikidata',note:searchItem.description||'',ambiguousIsin:activeIsins.length>1});
 }}
 return listings;
}
function onlineStatus(message){const el=document.getElementById('online-results');if(el)el.innerHTML='<p class="muted">'+esc(message)+'</p>'}
function renderOnlineResults(){const el=document.getElementById('online-results');if(!el)return;
 if(!onlineResults.length){onlineStatus('Keine börsennotierten Treffer mit Tickersymbol gefunden. Versuche einen anderen Unternehmensnamen oder verwende die manuelle Eingabe.');return}
 let h='<p class="catalog-meta">'+onlineResults.length+' mögliche Börseneinträge aus Wikidata · Stammdaten ungeprüft · keine Live-Kurse</p>';
 for(let i=0;i<onlineResults.length;i++){const s=onlineResults[i],present=catalogPresent(s);const missing=[!s.ticker?'Ticker':'',!s.exchange?'Börse':'',!s.currency?'Währung':'',!s.isin?'ISIN':''].filter(Boolean);h+=`<div class="catalog-item"><div><strong>${esc(s.name)} <span class="tiny muted">${esc(s.ticker)}</span></strong><small>${esc(s.isin||'ISIN offen')} · ${esc(s.exchange||'Börse offen')} · ${esc(s.currency||'Währung offen')}</small><small>${esc(s.note||'Wikidata-Eintrag')} · <a href="https://www.wikidata.org/wiki/${esc(s.qid)}" target="_blank" rel="noopener noreferrer">Quelle prüfen</a></small>${missing.length?`<small class="negative">Zu prüfen: ${esc(missing.join(', '))}${s.ambiguousIsin?' (mehrere ISINs)':''}</small>`:''}</div><button type="button" class="${present?'secondary':'primary'}" data-online="${i}" ${present?'disabled':''}>${present?'Vorhanden':missing.length?'Daten prüfen':'Übernehmen'}</button></div>`}
 el.innerHTML=h;
}
async function searchOnline(){const input=document.getElementById('online-search');if(!input)return;const term=input.value.trim();const request=++onlineRequest;if(onlineAbort)onlineAbort.abort();onlineResults=[];
 if(term.length<2){onlineStatus('Mindestens zwei Zeichen eingeben. Suche nach Unternehmensnamen; Ticker- und ISIN-Suchen sind in dieser Datenquelle nicht vollständig.');return}
 onlineAbort=new AbortController();const signal=onlineAbort.signal;onlineStatus('Online-Suche läuft …');
 try{
  const search=await wikiFetch({action:'wbsearchentities',search:term,language:'de',uselang:'de',type:'item',limit:'12'},signal);
  let matches=search.search||[];
  if(!matches.length){const fallback=await wikiFetch({action:'wbsearchentities',search:term,language:'en',uselang:'en',type:'item',limit:'12'},signal);matches=fallback.search||[]}
  const ids=uniq(matches.map(x=>x.id).filter(x=>/^Q\d+$/.test(x)));
  if(!ids.length){if(request===onlineRequest)renderOnlineResults();return}
  const detail=await wikiFetch({action:'wbgetentities',ids:ids.join('|'),props:'claims|labels',languages:'de|en'},signal);
  const exIds=uniq(Object.values(detail.entities||{}).flatMap(e=>(e.claims?.P414||[]).filter(activeClaim).map(claimId)).filter(x=>/^Q\d+$/.test(x)));
  const exData=exIds.length?await wikiFetch({action:'wbgetentities',ids:exIds.join('|'),props:'labels',languages:'de|en'},signal):{entities:{}};
  const exchanges=Object.fromEntries(Object.entries(exData.entities||{}).map(([qid,e])=>[qid,e.labels?.en?.value||e.labels?.de?.value||'']));
  if(request!==onlineRequest||activeTab!=='stocks')return;
  onlineResults=matches.flatMap(m=>wikiListings(detail.entities?.[m.id],m,exchanges)).filter(s=>s.name&&s.ticker).slice(0,24);
  renderOnlineResults();
 }catch(e){if(request!==onlineRequest||e.name==='AbortError')return;onlineStatus('Online-Suche derzeit nicht erreichbar: '+(e.message||'Netzwerkfehler')+'. Der Offline-Katalog und die manuelle Eingabe funktionieren weiter.')}
}
async function addOnlineStock(index){const s=onlineResults[index];if(!s)throw Error('Suchergebnis nicht mehr vorhanden.');if(catalogPresent(s))throw Error('Die Aktie ist bereits in deiner Beobachtungsliste.');
 if(!s.exchange||!s.currency||!s.isin){const form=document.getElementById('stock-form');if(!form)throw Error('Eingabeformular nicht gefunden.');for(const field of ['name','ticker','isin','exchange'])form.elements[field].value=s[field]||'';form.elements.currency.value=s.currency||'EUR';form.scrollIntoView({behavior:'smooth',block:'start'});alert('Die gefundenen Daten wurden ins Formular übernommen. Bitte Börse, ISIN und Währung prüfen und fehlende Angaben ergänzen. Noch nichts gespeichert.');return}
 const message=`Aktie übernehmen?\n\n${s.name}\nTicker: ${s.ticker}\nISIN: ${s.isin}\nBörse: ${s.exchange}\nHandelswährung (Vorschlag): ${s.currency}\n\nQuelle: Wikidata (nicht börslich verifiziert). Bitte prüfen.`;
 if(!confirm(message))return;
 const obj={id:id(),name:s.name,ticker:s.ticker,isin:s.isin,exchange:s.exchange,currency:s.currency,createdAt:new Date().toISOString(),catalogSource:'Wikidata',sourceEntity:s.qid,sourceCheckedAt:new Date().toISOString(),quality:'external-unverified'};
 await put('instruments',obj);await audit('STOCK_ONLINE_ADD',obj.id,s.qid+' '+s.ticker);await refresh();
}
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=v=>Number.isFinite(v)?new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(v):'–';
const number=(v,d=2)=>Number.isFinite(v)?new Intl.NumberFormat('de-DE',{maximumFractionDigits:d,minimumFractionDigits:d}).format(v):'–';
const stamp=s=>s?new Date(s).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'–';
const localNow=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
const parse=(v)=>{if(v===null||v===undefined||String(v).trim()==='')return NaN;return Number(String(v).replace(',','.'))};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('unity-lab',1);r.onupgradeneeded=()=>{for(const n of STORES)if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function bulkInsert(data){return new Promise((res,rej)=>{const tx=db.transaction(STORES,'readwrite');for(const store of STORES){const os=tx.objectStore(store);for(const item of data[store])os.add(item)}tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function audit(type,ref,detail){await put('audit',{id:id(),at:new Date().toISOString(),type,ref,detail})}
async function refresh(){for(const n of STORES)cache[n]=await all(n);render()}
function stocks(){return [...cache.instruments].sort((a,b)=>a.name.localeCompare(b.name))}
function quotesFor(sid){return cache.quotes.filter(q=>q.instrumentId===sid).sort((a,b)=>b.quotedAt.localeCompare(a.quotedAt)||b.createdAt.localeCompare(a.createdAt))}
function quote(sid){return quotesFor(sid)[0]}
function buys(sid){return cache.transactions.filter(t=>t.instrumentId===sid&&t.type==='BUY'&&!t.voidedAt)}
function calc(s){const tx=buys(s.id);const qty=tx.reduce((a,t)=>a+t.quantity,0);const cost=tx.reduce((a,t)=>a+t.amount*t.fx,0);const q=quote(s.id);const valid=!!q&&q.price>0&&q.fx>0;const value=valid?qty*q.price*q.fx:NaN;return {qty,cost,value,pnl:value-cost,quote:q,valid,tx:tx.length}}
function tableHead(cols){return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'}
function endTable(){return '</tbody></table></div>'}
function summary(){const pos=stocks().map(s=>({s,...calc(s)})).filter(p=>p.qty>0);const incomplete=pos.filter(p=>!p.valid);const cost=pos.reduce((a,p)=>a+p.cost,0);const value=incomplete.length?NaN:pos.reduce((a,p)=>a+p.value,0);return {pos,incomplete,cost,value,pnl:value-cost}}
function metrics(){const a=summary();return `<div class="grid"><div class="metric"><small>Hypothetisch investiert</small><strong>${euro(a.cost)}</strong></div><div class="metric"><small>Aktueller Depotwert</small><strong>${euro(a.value)}</strong></div><div class="metric"><small>Offener Gewinn / Verlust</small><strong class="${a.pnl>=0?'positive':'negative'}">${euro(a.pnl)}</strong><small>${a.cost>0&&Number.isFinite(a.pnl)?number(a.pnl/a.cost*100)+' %':'–'}</small></div><div class="metric"><small>Positionen</small><strong>${a.pos.length}</strong><small>${a.incomplete.length?'Bei '+a.incomplete.length+' fehlen Kurs/FX':''}</small></div></div>`}
function overview(){const a=summary();let h=`<div class="panel"><h2>Simulationsübersicht</h2>${metrics()}<div class="hint">Kurse und Wechselkurse werden in Version 0.1 manuell eingetragen. Werte sind <b>keine verifizierten Echtzeitdaten</b>. Fehlen Kurs oder Wechselkurs, wird der Gesamtgewinn bewusst nicht berechnet.</div></div><div class="panel"><h2>Offene hypothetische Positionen</h2>`;h+=tableHead(['Aktie','Käufe','Anteile','Einstand €','Marktwert €','Gewinn / Verlust']);if(!a.pos.length)h+='<tr><td colspan="6" class="empty">Noch keine hypothetischen Käufe. Zuerst eine Aktie anlegen, dann einen Kauf erfassen.</td></tr>';for(const p of a.pos){h+=`<tr><td><b>${esc(p.s.name)}</b><br><span class="muted tiny">${esc(p.s.ticker)} · ${esc(p.s.currency)}</span></td><td>${p.tx}</td><td>${number(p.qty,4)}</td><td>${euro(p.cost)}</td><td>${euro(p.value)}</td><td class="${p.pnl>=0?'positive':'negative'}">${euro(p.pnl)}<br><span class="tiny">${p.valid&&p.cost?number(p.pnl/p.cost*100)+' %':'Kurs fehlt'}</span></td></tr>`}h+=endTable()+'</div>';const st=cache.strategies.filter(x=>x.status==='active').sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];h+=`<div class="panel"><h2>Forschungsstand</h2><p>Aktive Strategie: <b>${esc(st?.version||'nicht festgelegt')}</b>. Änderungen werden im Forschungsbereich zunächst als Entwurf angelegt.</p><p class="muted">UNITY-Kaufprioritäten und automatische Analysen folgen erst mit einer verifizierten Datenanbindung in Version 0.2.</p></div>`;return h}
function stocksView(){let h=`<div class="panel"><h2>Online-Aktiensuche</h2><p class="muted">Suche weltweit nach einem Unternehmensnamen. Die Treffer stammen aus der offenen Wissensdatenbank Wikidata. Sie sind <b>keine geprüften Börsenstammdaten</b> und enthalten keine Kurse.</p><label>Unternehmen online suchen<input id="online-search" type="search" autocomplete="off" placeholder="z. B. Microsoft, Toyota, ASML"></label><div class="actions" style="margin-top:10px"><button class="secondary" id="online-search-button" type="button">Online suchen</button></div><div id="online-results" class="catalog-results"><p class="muted">Gib mindestens zwei Zeichen ein. Für die Online-Suche ist Internet erforderlich.</p></div><p class="tiny muted">Fehlende oder mehrdeutige Börsen-, ISIN- und Währungsangaben müssen vor dem Speichern geprüft werden. Börsenplätze können mehrere unterschiedliche Ticker führen.</p></div><div class="panel"><h2>Aktien schnell finden</h2><p class="muted">Suche nach Name, Ticker, ISIN oder Thema. Wähle <b>Hinzufügen</b> – alle Stammdaten werden übernommen.</p><label>Aktie suchen<input id="catalog-search" class="catalog-search" type="search" autocomplete="off" placeholder="z. B. ABB, Schneider, Stromnetze"></label><div id="catalog-results" class="catalog-results"></div><p class="tiny muted">Startkatalog mit ${CATALOG.length} kuratierten Einträgen. Keine automatische Aktualisierung; bitte Börsenstammdaten vor einer echten Anlageentscheidung prüfen.</p></div><div class="split"><div class="panel"><h2>Eigene Aktie hinzufügen</h2><form id="stock-form"><label>Name <input name="name" required maxlength="100" placeholder="z. B. ABB"></label><label>Ticker <input name="ticker" required maxlength="25" placeholder="z. B. ABBN"></label><label>ISIN (optional)<input name="isin" maxlength="12" placeholder="CH…"></label><label>Börse<input name="exchange" required maxlength="60" placeholder="z. B. SIX"></label><label>Handelswährung<select name="currency"><option>EUR</option><option>CHF</option><option>USD</option><option>GBP</option><option>SEK</option><option>NOK</option><option>DKK</option><option>JPY</option></select></label><div class="full actions"><button class="primary">Aktie hinzufügen</button></div></form></div><div class="panel"><h2>Manuellen Kurs erfassen</h2><form id="quote-form"><label>Aktie<select name="instrumentId" required>${stockOptions()}</select></label><label>Kurs in Handelswährung<input name="price" type="number" step="any" min="0.000001" required></label><label>Kurszeitpunkt<input name="quotedAt" type="datetime-local" value="${localNow()}" required></label><label>EUR je 1 Handelswährung<input name="fx" type="number" step="any" min="0.000001" placeholder="EUR = 1" required></label><label class="full">Quelle / Notiz<input name="source" maxlength="160" placeholder="z. B. manuell abgelesener Schlusskurs"></label><div class="full actions"><button class="primary" ${stocks().length?'':'disabled'}>Kurs protokollieren</button></div></form><p class="tiny muted">Für EUR 1 eintragen. Für CHF/USD usw. den zeitlich passenden EUR-Umrechnungskurs manuell ergänzen. Die Angabe wird als <b>nicht extern verifiziert</b> markiert.</p></div></div><div class="panel"><h2>Beobachtungsliste</h2>`;h+=tableHead(['Aktie','Börse','Letzter erfasster Kurs','Kursdatum','Status']);if(!stocks().length)h+='<tr><td colspan="5" class="empty">Noch keine Aktien vorhanden.</td></tr>';for(const s of stocks()){const q=quote(s.id);h+=`<tr><td><b>${esc(s.name)}</b><br><span class="tiny muted">${esc(s.ticker)} ${esc(s.isin||'')}</span></td><td>${esc(s.exchange)}<br>${esc(s.currency)}</td><td>${q?number(q.price,4)+' '+esc(s.currency):'–'}</td><td>${q?stamp(q.quotedAt):'–'}</td><td><span class="badge">${q?'Manuell / ungeprüft':'Keine Kursdaten'}</span></td></tr>`}return h+endTable()+'</div>'}
function stockOptions(){return stocks().map(s=>`<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.ticker)}, ${esc(s.currency)})</option>`).join('')}
function tradesView(){let h=`<div class="panel"><h2>Hypothetischen Kauf / Zukauf erfassen</h2><div class="hint">Jeder Zukauf ist eine neue, datierte Buchung. Die ursprünglichen Einträge bleiben erhalten. Für eine Korrektur kann ein fehlerhafter Eintrag storniert werden; er bleibt im Protokoll sichtbar.</div><form id="trade-form"><label>Aktie<select name="instrumentId" id="trade-stock" required>${stockOptions()}</select></label><label>Entscheidungszeitpunkt<input name="decidedAt" type="datetime-local" value="${localNow()}" required></label><label>Simulierter Kaufzeitpunkt<input name="executedAt" type="datetime-local" value="${localNow()}" required></label><label>Hypothetischer Betrag in Handelswährung<input name="amount" type="number" step="any" min="0.01" required></label><label>Simulierter Kaufkurs<input name="price" type="number" step="any" min="0.000001" required></label><label>EUR je 1 Handelswährung<input name="fx" type="number" step="any" min="0.000001" required placeholder="EUR = 1"></label><label class="full">Notiz / Entscheidungsgrund<textarea name="note" maxlength="1000" placeholder="Warum dieser hypothetische Einstieg?"></textarea></label><div class="full actions"><button class="primary" ${stocks().length?'':'disabled'}>Hypothetischen Kauf speichern</button></div></form></div><div class="panel"><h2>Transaktionshistorie</h2>`;h+=tableHead(['Entscheidung','Simulierter Kauf','Aktie','Betrag','Kurs / Stückzahl','Status']);const ts=[...cache.transactions].sort((a,b)=>b.executedAt.localeCompare(a.executedAt));if(!ts.length)h+='<tr><td colspan="6" class="empty">Noch keine Buchungen vorhanden.</td></tr>';for(const t of ts){const s=cache.instruments.find(s=>s.id===t.instrumentId);h+=`<tr><td>${stamp(t.decidedAt)}</td><td>${stamp(t.executedAt)}</td><td>${esc(s?.name||'Unbekannt')}<br><span class="tiny muted">${esc(t.note||'')}</span></td><td>${number(t.amount)} ${esc(s?.currency||'')}<br><span class="tiny">${euro(t.amount*t.fx)}</span></td><td>${number(t.price,4)}<br><span class="tiny">${number(t.quantity,4)} Stück</span></td><td>${t.voidedAt?`<span class="negative">Storniert ${stamp(t.voidedAt)}</span>`:`<button class="danger" data-void="${esc(t.id)}">Stornieren</button>`}</td></tr>`}return h+endTable()+'</div>'}
function researchView(){const versions=[...cache.strategies].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));const active=versions.find(s=>s.status==='active');let h=`<div class="split"><div class="panel"><h2>Strategie-Entwurf</h2><p class="muted">Neue Gewichtungen gelten nicht automatisch. Erst eine bewusste Aktivierung erzeugt eine neue Strategieversion.</p><form id="strategy-form"><label class="full">Bezeichnung der neuen Version<input name="version" required maxlength="45" placeholder="z. B. UNITY 5.3 Experiment A"></label>`;for(let i=0;i<keys.length;i++)h+=`<label class="full">${labels[i]} (%)<input name="${keys[i]}" type="number" min="0" max="100" step="1" value="${active?.weights?.[keys[i]]??defaults[keys[i]]}" required></label>`;h+=`<label class="full">Begründung / Hypothese<textarea name="reason" required maxlength="1200" placeholder="Welche Annahme soll überprüft werden?"></textarea></label><div class="full actions"><button class="primary" name="mode" value="draft">Als Entwurf speichern</button><button class="secondary" name="mode" value="active">Neue Version aktivieren</button></div></form><p class="tiny muted">Harte Veto-Regeln und die Datenfreigabe werden hier nicht verändert.</p></div><div class="panel"><h2>Strategieversionen</h2>`;if(!versions.length)h+='<p>Keine Strategie vorhanden.</p>';for(const s of versions){h+=`<div style="border-bottom:1px solid #e2e9ed;padding:12px 0"><b>${esc(s.version)}</b> <span class="badge">${s.status==='active'?'Aktiv':'Entwurf / Archiv'}</span><div class="tiny muted">${stamp(s.createdAt)}</div><p class="tiny">${esc(s.reason||'Grundversion')}</p><div class="tiny muted">${keys.map((k,i)=>labels[i]+': '+s.weights[k]+' %').join(' · ')}</div>${s.status==='draft'?`<button class="secondary" style="margin-top:9px" data-activate="${esc(s.id)}">Entwurf aktivieren</button>`:''}</div>`}h+=`</div></div><div class="panel"><h2>Forschungslogik</h2><p>Geplante Erweiterung: Strategien gegen dieselben historischen Aktien- und Kursdaten testen, die Prognosen archivieren und Kaufprioritäten vergleichen. In 0.1 gibt es noch keinen belastbaren Backtest und keinen automatischen UNITY-Score.</p></div>`;return h}
function backupView(){return `<div class="panel"><h2>Datensicherung</h2><p>Alle Datensätze werden lokal in der Browser-Datenbank gespeichert. Diese Speicherung ist an den jeweiligen Browser und die Website-Adresse gebunden. Sie ersetzt <b>kein Backup</b>.</p><div class="actions"><button class="primary" id="export">Vollständiges JSON-Backup herunterladen</button></div></div><div class="panel"><h2>Backup ergänzend importieren</h2><p>Vorhandene Datensätze werden <b>niemals überschrieben</b>. Neue Datensätze werden anhand ihrer eindeutigen IDs ergänzt. Abweichende Inhalte mit identischer ID werden als Konflikt zurückgewiesen. Erstelle vor dem Import ein Backup.</p><label>JSON-Backup auswählen<input type="file" accept="application/json,.json" id="import-file"></label><div class="actions" style="margin-top:12px"><button class="secondary" id="import">Import prüfen und ergänzen</button></div></div><div class="panel"><h2>Umsetzungsstand</h2><p><span class="badge">0.1 – lokaler Prototyp</span></p><p>Vorhanden: Aktien, manuelle Kursprotokolle, datierte hypothetische Käufe und Zukäufe, EUR-Bewertung bei manuell erfasstem FX-Kurs, Transaktionsstorno mit Historie, Strategiefassungen, Backup.</p><p>Noch nicht vorhanden: Echtzeitkurse, automatische UNITY-Analysen, echte Priorisierung, Dividenden, Teilverkäufe, pCloud-Synchronisation, automatische Ereignisprüfung und vollständiges Backtesting.</p></div>`}
function render(){const pages={overview,stocks:stocksView,trades:tradesView,research:researchView,backup:backupView};document.getElementById('app').innerHTML=pages[activeTab]();if(activeTab==='stocks'){catalogResults();onlineResults=[];onlineRequest++;if(onlineAbort)onlineAbort.abort()}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab))}
async function handleForm(e){if(!e.target.matches('form'))return;e.preventDefault();const f=e.target, d=Object.fromEntries(new FormData(f));try{if(f.id==='stock-form'){const ticker=d.ticker.trim().toUpperCase();if(cache.instruments.some(x=>x.ticker.toUpperCase()===ticker&&x.exchange.toLowerCase()===d.exchange.trim().toLowerCase()))throw Error('Ticker und Börsenplatz sind bereits vorhanden.');const s={id:id(),name:d.name.trim(),ticker,isin:d.isin.trim().toUpperCase(),exchange:d.exchange.trim(),currency:d.currency,createdAt:new Date().toISOString()};if(!s.name||!s.ticker||!s.exchange)throw Error('Pflichtfelder fehlen.');await put('instruments',s);await audit('STOCK_ADD',s.id,s.ticker)}else if(f.id==='quote-form'){const s=cache.instruments.find(x=>x.id===d.instrumentId);if(!s)throw Error('Aktie fehlt.');const price=parse(d.price),fx=parse(d.fx);if(!(price>0&&fx>0))throw Error('Kurs und FX müssen positiv sein.');if(new Date(d.quotedAt).getTime()>Date.now()+60000)throw Error('Kurszeitpunkt liegt in der Zukunft.');const q={id:id(),instrumentId:s.id,price,fx,quotedAt:new Date(d.quotedAt).toISOString(),createdAt:new Date().toISOString(),source:d.source.trim()||'Manuelle Eingabe',quality:'manual-unverified'};await put('quotes',q);await audit('QUOTE_ADD',q.id,s.ticker)}else if(f.id==='trade-form'){const s=cache.instruments.find(x=>x.id===d.instrumentId);if(!s)throw Error('Aktie fehlt.');const amount=parse(d.amount),price=parse(d.price),fx=parse(d.fx);if(!(amount>0&&price>0&&fx>0))throw Error('Betrag, Kurs und FX müssen positiv sein.');const decidedAt=new Date(d.decidedAt),executedAt=new Date(d.executedAt);if(!Number.isFinite(decidedAt.getTime())||!Number.isFinite(executedAt.getTime()))throw Error('Datum ungültig.');if(decidedAt>executedAt)throw Error('Die Entscheidung darf nicht nach dem simulierten Kauf liegen.');if(executedAt.getTime()>Date.now()+60000)throw Error('Zukünftige Käufe dürfen nicht als bereits ausgeführt gebucht werden.');const t={id:id(),instrumentId:s.id,decidedAt:decidedAt.toISOString(),executedAt:executedAt.toISOString(),type:'BUY',amount,price,fx,quantity:amount/price,note:d.note.trim(),createdAt:new Date().toISOString()};await put('transactions',t);await audit('BUY_ADD',t.id,s.ticker)}else if(f.id==='strategy-form'){const weights={};for(const k of keys){const v=parse(d[k]);if(!Number.isInteger(v)||v<0||v>100)throw Error('Gewichte müssen ganze Prozentwerte von 0 bis 100 sein.');weights[k]=v}if(Object.values(weights).reduce((a,b)=>a+b,0)!==100)throw Error('Die Gewichte müssen zusammen genau 100 % ergeben.');if(!d.version.trim()||!d.reason.trim())throw Error('Name und Hypothese sind Pflicht.');const mode=e.submitter?.value||'draft';if(mode==='active'&&!confirm('Neue Strategieversion aktivieren? Bisherige Versionen bleiben archiviert.'))return;const s={id:id(),version:d.version.trim(),weights,reason:d.reason.trim(),status:mode==='active'?'active':'draft',createdAt:new Date().toISOString()};if(mode==='active')await deactivateStrategies();await put('strategies',s);await audit('STRATEGY_ADD',s.id,s.version)}await refresh();}catch(err){alert(err.message||String(err))}}
async function deactivateStrategies(){for(const s of cache.strategies.filter(x=>x.status==='active')){await put('strategies',{...s,status:'archived'});await audit('STRATEGY_ARCHIVE',s.id,s.version)}}
async function activateStrategy(sid){const s=cache.strategies.find(x=>x.id===sid&&x.status==='draft');if(!s||!confirm('Diesen Strategieentwurf aktivieren?'))return;await deactivateStrategies();await put('strategies',{...s,status:'active',activatedAt:new Date().toISOString()});await audit('STRATEGY_ACTIVATE',s.id,s.version);await refresh()}
async function voidTrade(tid){const t=cache.transactions.find(x=>x.id===tid&&!x.voidedAt);if(!t||!confirm('Hypothetischen Kauf stornieren? Die Buchung bleibt sichtbar.'))return;await put('transactions',{...t,voidedAt:new Date().toISOString()});await audit('BUY_VOID',tid,'Storno');await refresh()}
async function exportBackup(){const payload={format:'unity-lab-backup',schema:1,exportedAt:new Date().toISOString(),data:{}};for(const n of STORES)payload.data[n]=await all(n);const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='unity-lab-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importBackup(){const file=document.getElementById('import-file')?.files?.[0];if(!file)throw Error('Bitte eine Datei auswählen.');if(file.size>5e6)throw Error('Backup größer als 5 MB.');const obj=JSON.parse(await file.text());if(obj.format!=='unity-lab-backup'||obj.schema!==1||!obj.data)throw Error('Ungültiges Unity-Lab-Backup.');const inserts={};let count=0;for(const n of STORES){if(!Array.isArray(obj.data[n]))throw Error('Backup unvollständig: '+n);const existing=new Map(cache[n].map(x=>[x.id,x]));const seen=new Set();inserts[n]=[];for(const item of obj.data[n]){if(!item||typeof item!=='object'||typeof item.id!=='string'||item.id.length>150||seen.has(item.id))throw Error('Ungültige oder doppelte ID in '+n);seen.add(item.id);if(existing.has(item.id)){if(JSON.stringify(existing.get(item.id))!==JSON.stringify(item))throw Error('Konflikt bei ID '+item.id+' in '+n+'. Import vollständig abgebrochen.');}else{inserts[n].push(item);count++}}}if(!count){alert('Keine neuen Datensätze.');return}if(!confirm(count+' neue Datensätze ergänzen? Vorhandene Daten bleiben unverändert.'))return;await bulkInsert(inserts);await refresh();alert(count+' Datensätze ergänzt.')}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){activeTab=b.dataset.tab;render()}});document.addEventListener('submit',handleForm);document.addEventListener('input',e=>{if(e.target.id==='catalog-search')catalogResults();if(e.target.id==='online-search'){clearTimeout(onlineTimer);onlineTimer=setTimeout(searchOnline,550)}});document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.catalog!==undefined)await addCatalogStock(Number(b.dataset.catalog));if(b.dataset.online!==undefined)await addOnlineStock(Number(b.dataset.online));if(b.id==='online-search-button'){clearTimeout(onlineTimer);await searchOnline()}if(b.dataset.void)await voidTrade(b.dataset.void);if(b.dataset.activate)await activateStrategy(b.dataset.activate);if(b.id==='export')await exportBackup();if(b.id==='import')await importBackup()}catch(err){alert(err.message||String(err))}});
(async()=>{try{db=await openDB();const s=await all('strategies');if(!s.length)await put('strategies',{id:id(),version:'UNITY 5.2 – Basis',weights:defaults,reason:'Dokumentierte Ausgangsgewichtung; noch nicht empirisch validiert.',status:'active',createdAt:new Date().toISOString()});document.getElementById('db-status').textContent='Lokal gespeichert · kein Live-Kursfeed';await refresh();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){document.getElementById('db-status').textContent='Speicherfehler';document.getElementById('app').innerHTML='<div class="alert">Die lokale Datenbank konnte nicht geöffnet werden: '+esc(e.message)+'</div>'}})();
</script></body></html>
