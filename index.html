async function wikiSearchCandidates(term,signal){

 for(const language of ['de','en']){
  const data=await wikiFetch({action:'wbsearchentities',search:term,language,uselang:language,type:'item',limit:'12'},signal);
  for(const item of data.search||[])if(/^Q\d+$/.test(item.id)&&!seen.has(item.id)){seen.add(item.id);out.push(item)}
  if(out.length>=12)break;
 }
 const q=term.trim().toUpperCase();
 if(/^[A-Z]{2}[A-Z0-9]{10}$/.test(q)||/^[A-Z0-9.\-]{2,8}$/.test(q)){
  const property=q.length===12?'P946':'P249';
  try{
   const data=await wikiFetch({action:'query',list:'search',srsearch:'haswbstatement:"'+property+'='+q+'"',srnamespace:'0',srlimit:'12'},signal);
   for(const page of data.query?.search||[]){
    const id=String(page.title||'');
    if(/^Q\d+$/.test(id)&&!seen.has(id)){seen.add(id);out.push({id,label:q,description:'Wertpapierkennung aus Wikidata'})}
   }
  }catch(e){if(e.name==='AbortError')throw e}
 }
 return out.slice(0,24);
}

async function searchOnline(){const input=document.getElementById('online-search');if(!input)return;const term=input.value.trim();const request=++onlineRequest;if(onlineAbort)onlineAbort.abort();onlineResults=[];
 if(term.length<2){onlineStatus('Mindestens zwei Zeichen eingeben. Suche nach Unternehmensnamen, Börsenkürzel oder ISIN.');return}
 const known=verifiedCatalogSearch(term);
 if(known.length){showVerifiedCatalogMatches(known);return}
 onlineAbort=new AbortController();const signal=onlineAbort.signal;onlineStatus('Weltweite Börsensuche läuft …');
 try{
  if(typeof unitySearchWorldwide==='function'){
   try{
    const global=await unitySearchWorldwide(term,signal);
    if(request!==onlineRequest||activeTab!=='stocks')return;
    if(global.length){onlineResults=global;renderOnlineResults();return}
   }catch(error){if(error.name==='AbortError')return}
  }
  onlineStatus('Weltweite Börsenquelle ohne Treffer; prüfe offene Unternehmensdaten …');
  const matches=await wikiSearchCandidates(term,signal);
  const ids=uniq(matches.map(x=>x.id).filter(x=>/^Q\d+$/.test(x)));
  if(!ids.length){if(request===onlineRequest)renderOnlineResults();return}
  const detail=await wikiFetch({action:'wbgetentities',ids:ids.join('|'),props:'claims|labels',languages:'de|en'},signal);
  const exIds=uniq(Object.values(detail.entities||{}).flatMap(e=>(e.claims?.P414||[]).filter(activeClaim).map(claimId)).filter(x=>/^Q\d+$/.test(x)));
  const exData=exIds.length?await wikiFetch({action:'wbgetentities',ids:exIds.join('|'),props:'labels',languages:'de|en'},signal):{entities:{}};
  const exchanges=Object.fromEntries(Object.entries(exData.entities||{}).map(([qid,e])=>[qid,e.labels?.en?.value||e.labels?.de?.value||'']));
  if(request!==onlineRequest||activeTab!=='stocks')return;
  onlineResults=matches.flatMap(m=>wikiListings(detail.entities?.[m.id],m,exchanges)).filter(s=>s.name&&(s.ticker||s.isin)).slice(0,24);
  renderOnlineResults();
 }catch(e){if(request!==onlineRequest||e.name==='AbortError')return;onlineStatus('Online-Suche derzeit nicht erreichbar: '+(e.message||'Netzwerkfehler')+'. Der Offline-Katalog und die manuelle Eingabe funktionieren weiter.')}
}
async function resolveWorldwideIsin(candidate){
 if(!candidate?.name||!candidate.providerSymbol)return '';
 try{
  const term=candidate.name.slice(0,70),data=await wikiFetch({action:'wbsearchentities',search:term,language:'en',type:'item',limit:'8'});
  const ids=(data.search||[]).map(x=>x.id).filter(x=>/^Q\d+$/.test(x));
  if(!ids.length)return '';
  const response=await wikiFetch({action:'wbgetentities',ids:ids.join('|'),props:'claims|labels',languages:'en|de'});
  const key=candidate.providerSymbol.split('.')[0].toUpperCase(),possible=[];
  for(const entity of Object.values(response.entities||{})){
   const claims=entity.claims||{};
   const tickers=(claims.P249||[]).filter(activeClaim).map(claimString).map(x=>x.toUpperCase());
   for(const exchange of (claims.P414||[]).filter(activeClaim))for(const q of exchange.qualifiers?.P249||[])
    if(typeof q.datavalue?.value==='string')tickers.push(q.datavalue.value.toUpperCase());
   if(!tickers.includes(key)&&!tickers.includes(candidate.providerSymbol.toUpperCase()))continue;
   for(const c of (claims.P946||[]).filter(activeClaim)){
    const isin=cleanIsin(claimString(c));
    if(isin)possible.push(isin);
   }
  }
  return [...new Set(possible)].length===1?possible[0]:'';
 }catch(e){return ''}
}

function tradesView(){let h=(typeof depotCsvPanel==='function'?depotCsvPanel():'')+(typeof depotSellForm==='function'?depotSellForm():'')+`<div class="panel"><h2>Hypothetischen Kauf / Zukauf erfassen</h2><div class="hint">Jeder Zukauf ist eine neue, datierte Buchung. Die ursprünglichen Einträge bleiben erhalten. Für eine Korrektur kann ein fehlerhafter Eintrag storniert werden; er bleibt im Protokoll sichtbar.</div><form id="trade-form"><label>Aktie<select name="instrumentId" id="trade-stock" required>${stockOptions()}</select></label><label>Entscheidungszeitpunkt<input name="decidedAt" type="datetime-local" value="${localNow()}" required></label><label>Simulierter Kaufzeitpunkt<input name="executedAt" type="datetime-local" value="${localNow()}" required></label><label>Hypothetischer Betrag in Handelswährung<input name="amount" type="number" step="any" min="0.01" required></label><label>Simulierter Kaufkurs<input name="price" type="number" step="any" min="0.000001" required></label><label>EUR je 1 Handelswährung<input name="fx" type="number" step="any" min="0.000001" required placeholder="EUR = 1"></label><label>Gebühr in EUR<input name="fee" type="number" step="0.01" min="0" value="1.00" required><small>Standard 1,00 € je Simulation; bei Bedarf ändern.</small></label><label class="full">Notiz / Entscheidungsgrund<textarea name="note" maxlength="1000" placeholder="Warum dieser hypothetische Einstieg?"></textarea></label><div class="full actions"><button class="primary" ${stocks().length?'':'disabled'}>Hypothetischen Kauf speichern</button></div></form></div><div class="panel"><h2>Transaktionshistorie</h2>`;h+=tableHead(['Entscheidung','Simulierter Handel','Aktie','Betrag','Kurs / Stückzahl','Status']);const ts=[...cache.transactions].sort((a,b)=>b.executedAt.localeCompare(a.executedAt));if(!ts.length)h+='<tr><td colspan="6" class="empty">Noch keine Buchungen vorhanden.</td></tr>';for(const t of ts){const s=cache.instruments.find(s=>s.id===t.instrumentId);h+=`<tr><td>${stamp(t.decidedAt)}</td><td>${stamp(t.executedAt)}</td><td>${esc(s?.name||'Unbekannt')}<br><b>${t.type==='SELL'?'Verkauf':'Kauf'}</b><br><span class="tiny muted">${esc(t.note||'')}</span></td><td>${number(t.amount)} ${esc(s?.currency||'')}<br><span class="tiny">${euro(t.amount*t.fx)} · Gebühr ${euro(Number(t.fee)||0)}</span></td><td>${number(t.price,4)}<br><span class="tiny">${number(t.quantity,4)} Stück</span></td><td>${t.voidedAt?`<span class="negative">Storniert ${stamp(t.voidedAt)}</span>`:`<button class="danger" data-void="${esc(t.id)}">Stornieren</button>`}</td></tr>`}return h+endTable()+'</div>'}
function backupView(){return `<div class="panel"><h2>Datensicherung</h2><p>Alle Datensätze werden lokal in der Browser-Datenbank gespeichert. Diese Speicherung ist an den jeweiligen Browser und die Website-Adresse gebunden. Sie ersetzt <b>kein Backup</b>.</p><div class="actions"><button class="primary" id="export">Vollständiges JSON-Backup herunterladen</button></div></div><div class="panel"><h2>Backup ergänzend importieren</h2><p>Aktien und Buchungen werden anhand ihrer eindeutigen IDs ergänzt und niemals überschrieben. Nur beim fiktiven Grundkapital kann ein abweichender Betrag aus dem gewählten Backup nach deiner Bestätigung übernommen werden.</p><label>JSON-Backup auswählen<input type="file" accept="application/json,.json" id="import-file"></label><div class="actions" style="margin-top:12px"><button class="secondary" id="import">Import prüfen und ergänzen</button></div></div><div class="panel"><h2>Umsetzungsstand</h2><p><span class="badge">0.1 – lokaler Prototyp</span></p><p>Vorhanden: Aktien, manuelle Kursprotokolle, datierte hypothetische Käufe und Zukäufe, EUR-Bewertung bei manuell erfasstem FX-Kurs, Transaktionsstorno mit Historie, Strategiefassungen, Backup.</p><p>Analyse-Beta mit Teil-Scores, Kursindikatoren, Veto-Prüfung und archivierten Snapshots. Noch nicht vorhanden: verifizierte Intradaykurse, automatische Fundamentaldaten, vollständige UNITY-Kaufempfehlungen, pCloud-Synchronisation und Backtesting.</p></div>`}
function render(){const pages={overview,stocks:stocksView,analysis:analysisView,trades:tradesView,backup:backupView};document.getElementById('app').innerHTML=pages[activeTab]();if(activeTab==='stocks'){catalogResults();onlineResults=[];onlineRequest++;if(onlineAbort)onlineAbort.abort()}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab))}
async function handleForm(e){if(!e.target.matches('form')||['unity-fund','unity-csv','sell-form'].includes(e.target.id))return;e.preventDefault();const f=e.target, d=Object.fromEntries(new FormData(f));try{if(f.id==='stock-form'){const ticker=d.ticker.trim().toUpperCase();if(cache.instruments.some(x=>x.ticker.toUpperCase()===ticker&&x.exchange.toLowerCase()===d.exchange.trim().toLowerCase()))throw Error('Ticker und Börsenplatz sind bereits vorhanden.');const s={id:id(),name:d.name.trim(),ticker,isin:d.isin.trim().toUpperCase(),exchange:d.exchange.trim(),currency:d.currency,createdAt:new Date().toISOString()};if(!s.name||!s.ticker||!s.exchange)throw Error('Pflichtfelder fehlen.');await put('instruments',s);await audit('STOCK_ADD',s.id,s.ticker)}else if(f.id==='quote-form'){const s=cache.instruments.find(x=>x.id===d.instrumentId);if(!s)throw Error('Aktie fehlt.');const price=parse(d.price),fx=parse(d.fx);if(!(price>0&&fx>0))throw Error('Kurs und FX müssen positiv sein.');if(new Date(d.quotedAt).getTime()>Date.now()+60000)throw Error('Kurszeitpunkt liegt in der Zukunft.');const q={id:id(),instrumentId:s.id,price,fx,quotedAt:new Date(d.quotedAt).toISOString(),createdAt:new Date().toISOString(),source:d.source.trim()||'Manuelle Eingabe',quality:'manual-unverified'};await put('quotes',q);await audit('QUOTE_ADD',q.id,s.ticker)}else if(f.id==='trade-form'){const s=cache.instruments.find(x=>x.id===d.instrumentId);if(!s)throw Error('Aktie fehlt.');const amount=parse(d.amount),price=parse(d.price),fx=parse(d.fx),fee=parse(d.fee||0);if(!(amount>0&&price>0&&fx>0&&fee>=0))throw Error('Betrag, Kurs und FX müssen positiv sein; die Gebühr darf nicht negativ sein.');const decidedAt=new Date(d.decidedAt),executedAt=new Date(d.executedAt);if(!Number.isFinite(decidedAt.getTime())||!Number.isFinite(executedAt.getTime()))throw Error('Datum ungültig.');if(decidedAt>executedAt)throw Error('Die Entscheidung darf nicht nach dem simulierten Kauf liegen.');if(executedAt.getTime()>Date.now()+60000)throw Error('Zukünftige Käufe dürfen nicht als bereits ausgeführt gebucht werden.');const t={id:id(),instrumentId:s.id,decidedAt:decidedAt.toISOString(),executedAt:executedAt.toISOString(),type:'BUY',amount,price,fx,fee,quantity:amount/price,note:d.note.trim(),createdAt:new Date().toISOString()};await put('transactions',t);await audit('BUY_ADD',t.id,s.ticker)}else if(f.id==='strategy-form'){const weights={};for(const k of keys){const v=parse(d[k]);if(!Number.isInteger(v)||v<0||v>100)throw Error('Gewichte müssen ganze Prozentwerte von 0 bis 100 sein.');weights[k]=v}if(Object.values(weights).reduce((a,b)=>a+b,0)!==100)throw Error('Die Gewichte müssen zusammen genau 100 % ergeben.');if(!d.version.trim()||!d.reason.trim())throw Error('Name und Hypothese sind Pflicht.');const mode=e.submitter?.value||'draft';if(mode==='active'&&!confirm('Neue Strategieversion aktivieren? Bisherige Versionen bleiben archiviert.'))return;const s={id:id(),version:d.version.trim(),weights,reason:d.reason.trim(),status:mode==='active'?'active':'draft',createdAt:new Date().toISOString()};if(mode==='active')await deactivateStrategies();await put('strategies',s);await audit('STRATEGY_ADD',s.id,s.version)}await refresh();}catch(err){alert(err.message||String(err))}}
async function deactivateStrategies(){for(const s of cache.strategies.filter(x=>x.status==='active')){await put('strategies',{...s,status:'archived'});await audit('STRATEGY_ARCHIVE',s.id,s.version)}}
async function activateStrategy(sid){const s=cache.strategies.find(x=>x.id===sid&&x.status==='draft');if(!s||!confirm('Diesen Strategieentwurf aktivieren?'))return;await deactivateStrategies();await put('strategies',{...s,status:'active',activatedAt:new Date().toISOString()});await audit('STRATEGY_ACTIVATE',s.id,s.version);await refresh()}
async function voidTrade(tid){const t=cache.transactions.find(x=>x.id===tid&&!x.voidedAt);if(!t)return;if(t.type==='BUY'&&typeof depotActiveTrades==='function'){let n=0;for(const x of depotActiveTrades(t.instrumentId).filter(x=>x.id!==tid)){n+=x.type==='BUY'?Number(x.quantity):-Number(x.quantity);if(n< -1e-8)throw Error('Dieser Kauf kann nicht storniert werden, weil spätere Verkäufe davon abhängen. Bitte zuerst die betreffenden Verkäufe stornieren.')}}if(!confirm('Simulierten '+(t.type==='SELL'?'Verkauf':'Kauf')+' stornieren? Die Buchung bleibt sichtbar.'))return;await put('transactions',{...t,voidedAt:new Date().toISOString()});await audit(t.type==='SELL'?'SELL_VOID':'BUY_VOID',tid,'Storno');await refresh()}
async function exportBackup(){const payload={format:'unity-lab-backup',schema:3,exportedAt:new Date().toISOString(),data:{}};for(const n of STORES)payload.data[n]=await all(n);const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='unity-lab-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importBackup(){const file=document.getElementById('import-file')?.files?.[0];if(!file)throw Error('Bitte eine Datei auswählen.');if(file.size>5e6)throw Error('Backup größer als 5 MB.');const obj=JSON.parse(await file.text());if(obj.format!=='unity-lab-backup'||![1,2,3].includes(obj.schema)||!obj.data)throw Error('Ungültiges Unity-Lab-Backup.');const inserts={},replacements={};let count=0,capitalReplacement=null;for(const n of STORES){if(obj.schema<3&&!obj.data[n]&&['fundamentals','histories','analyses','settings'].includes(n))obj.data[n]=[];if(!Array.isArray(obj.data[n]))throw Error('Backup unvollständig: '+n);const existing=new Map(cache[n].map(x=>[x.id,x]));const seen=new Set();inserts[n]=[];replacements[n]=[];for(const item of obj.data[n]){if(!item||typeof item!=='object'||typeof item.id!=='string'||item.id.length>150||seen.has(item.id))throw Error('Ungültige oder doppelte ID in '+n);seen.add(item.id);if(existing.has(item.id)){if(JSON.stringify(existing.get(item.id))!==JSON.stringify(item)){if(n==='settings'&&item.id==='portfolio-capital'){capitalReplacement=item;replacements[n].push(item);count++;}else throw Error('Konflikt bei ID '+item.id+' in '+n+'. Import vollständig abgebrochen.');}}else{inserts[n].push(item);count++}}}if(!count){alert('Keine neuen Datensätze.');return}if(capitalReplacement&&!confirm('Das Backup enthält ein anderes fiktives Grundkapital ('+euro(Number(capitalReplacement.amount))+'). Diesen Backup-Betrag übernehmen und die übrigen Daten ergänzen?'))return;if(!confirm(count+' Datensätze aus dem Backup übernehmen? Aktien und Buchungen werden ergänzt; nur das fiktive Grundkapital kann aus dem Backup ersetzt werden.'))return;await bulkInsert(inserts,replacements);await refresh();alert(count+' Datensätze aus dem Backup übernommen.')}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){activeTab=b.dataset.tab;render();if(activeTab==='analysis'&&typeof publicFetch==='function'&&CATALOG.some(x=>x.isin===stocks().find(y=>y.id===selectedUnityStock)?.isin))publicFetch()}});document.addEventListener('submit',handleForm);document.addEventListener('input',e=>{if(e.target.id==='catalog-search')catalogResults();if(e.target.id==='online-search'){clearTimeout(onlineTimer);onlineTimer=setTimeout(searchOnline,550)}});document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.catalog!==undefined)await addCatalogStock(Number(b.dataset.catalog));if(b.dataset.online!==undefined)await addOnlineStock(Number(b.dataset.online));if(b.id==='online-search-button'){clearTimeout(onlineTimer);await searchOnline()}if(b.dataset.void)await voidTrade(b.dataset.void);if(b.dataset.activate)await activateStrategy(b.dataset.activate);if(b.id==='export')await exportBackup();if(b.id==='import')await importBackup()}catch(err){alert(err.message||String(err))}});
