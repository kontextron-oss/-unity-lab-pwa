<div id="app"><main class="main" role="status" aria-live="polite"><h1>Kontakte</h1><p class="muted">Kontakte werden geöffnet …</p></main></div>
<script>
"use strict";
(()=>{
const route=location.pathname;
const PROFILE=route.includes("/klaus-kontakte/")?{id:"klaus",title:"Klaus – Kontakte"}:route.includes("/jan-kontakte/")?{id:"jan",title:"Jan – Kontakte"}:{id:"kontakte",title:"Kontakte"};
const app=document.getElementById("app"),DB_NAME=PROFILE.id==="kontakte"?"kontakte-lokal-v1":PROFILE.id+"-kontakte-lokal-v1",STORE="kontakte",KEY=PROFILE.id==="kontakte"?"kontakte-lokal-fallback-v1":PROFILE.id+"-kontakte-lokal-fallback-v1",DEMO_KEY=PROFILE.id+"-kontakte-beispiel-ausgeblendet";
document.title=PROFILE.title;
document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute("content",PROFILE.title);
const demo={id:"__beispiel__",name:"Anna Müller (Beispiel)",phone:"0176 12345678",phones:[{label:"Mobil",number:"0176 12345678"}],email:"",website:"",notes:"",street:"Musterstraße",house:"12",zip:"01234",city:"Dresden",demo:true};
let records=[],db=null,storage="nicht verfügbar",view="home",mode="contact",selected=null,term="",editing=null,message="",phoneSeed=0,demoHidden=false,voiceTimer=0,searchOpen=false,letter="",alphabetOpen=false;
const E=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=x=>String(x||"").toLocaleLowerCase("de").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss");
const nameKey=x=>N(x).replace(/sch/g,"s").replace(/ch/g,"k").replace(/ph/g,"f").replace(/th/g,"t").replace(/(.)\1+/g,"$1").replace(/e\b/g,"");
const nameMatches=(name,query)=>{const plain=N(name),asked=N(query),key=nameKey(name),wanted=nameKey(query);return plain.includes(asked)||key.includes(wanted)||wanted.includes(key);};
function editDistance(a,b){
 const rows=Array.from({length:a.length+1},(_,i)=>[i]);
 for(let j=1;j<=b.length;j++)rows[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)rows[i][j]=a[i-1]===b[j-1]?rows[i-1][j-1]:1+Math.min(rows[i-1][j],rows[i][j-1],rows[i-1][j-1]);
 return rows[a.length][b.length];
}
const fuzzyNameMatches=(name,query)=>{
 if(nameMatches(name,query))return true;
 const wanted=nameKey(query).split(/\s+/).filter(x=>x.length>=3),parts=nameKey(name).split(/\s+/).filter(x=>x.length>=3);
 return wanted.length>0&&wanted.every(word=>parts.some(part=>{const longest=Math.max(word.length,part.length);return longest>=5&&editDistance(word,part)<=((longest>=8)?2:1);}));
};
const all=()=>[...(demoHidden?[]:[demo]),...records].sort((a,b)=>Number(Boolean(b.favorite))-Number(Boolean(a.favorite))||a.name.localeCompare(b.name,"de"));
const get=id=>all().find(c=>c.id===id);
const stamp=()=>new Date().toISOString();
function valid(x){
 if(!x||typeof x!=="object"||typeof x.name!=="string"||!x.name.trim()||x.id==="__beispiel__")return null;
 const str=(k,m)=>String(x[k]??"").trim().slice(0,m);
 const labels=new Set(["Mobil","Privat","Arbeit","Andere"]);
 let phones=Array.isArray(x.phones)?x.phones.map(p=>({
  label:labels.has(p?.label)?p.label:"Andere",
  number:String(p?.number??"").trim().slice(0,70)
 })).filter(p=>p.number).slice(0,30):[];
 if(!phones.length&&str("phone",70))phones=[{label:"Mobil",number:str("phone",70)}];
 return {
  id:str("id",90)||("k-"+newId()),name:str("name",110),
  phone:phones[0]?.number||"",phones,
  email:str("email",180),website:str("website",250),notes:str("notes",4000),
  street:str("street",120),house:str("house",22),zip:str("zip",16),
  city:str("city",100),favorite:x.favorite===true,updatedAt:str("updatedAt",35)||stamp()
 };
}
function newId(){return crypto?.randomUUID?.()||("id-"+Date.now()+"-"+Math.random().toString(36).slice(2));}
function phoneList(c){return c.phones?.length?c.phones:(c.phone?[{label:"Mobil",number:c.phone}]:[]);}
function safeSite(raw){
 const s=String(raw||"").trim();if(!s)return "";
 try{const url=new URL(/^https?:\/\//i.test(s)?s:"https://"+s);return url.protocol==="https:"||url.protocol==="http:"?url.href:"";}catch(e){return "";}
}
function samePhone(a,b){const x=String(a||"").replace(/\D/g,""),y=String(b||"").replace(/\D/g,"");return x.length>=3&&x===y;}
function isDuplicate(c,list=records){return list.some(x=>x.id===c.id||(N(x.name)===N(c.name)&&phoneList(x).some(p=>phoneList(c).some(y=>samePhone(y.number,p.number)))));}
function importPlan(list){
 let duplicates=0,invalid=0;const add=[];
 for(const raw of list.slice(0,3000)){const c=valid(raw);if(!c){invalid++;continue;}if(isDuplicate(c,[...records,...add])){duplicates++;continue;}add.push(c);}
 return {add,duplicates,invalid,limited:list.length>3000};
}
function vEscape(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");}
function vUnescape(s){return String(s||"").replace(/\\n/gi,"\n").replace(/\\([,;\\])/g,"$1");}
function toVcard(list){
 return list.map(c=>{
  const lines=["BEGIN:VCARD","VERSION:3.0","FN:"+vEscape(c.name),"UID:"+vEscape(c.id)];
  for(const p of phoneList(c))lines.push("TEL;TYPE="+({Mobil:"CELL",Privat:"HOME",Arbeit:"WORK",Andere:"VOICE"}[p.label]||"VOICE")+":"+vEscape(p.number));
  if(c.email)lines.push("EMAIL:"+vEscape(c.email));
  if(c.website)lines.push("URL:"+vEscape(c.website));
  if(c.street||c.house||c.zip||c.city)lines.push("ADR;TYPE=HOME:;;"+vEscape([c.street,c.house].filter(Boolean).join(" "))+";"+vEscape(c.city)+";;"+vEscape(c.zip)+";");
  if(c.notes)lines.push("NOTE:"+vEscape(c.notes));
  lines.push("END:VCARD");return lines.join("\r\n");
 }).join("\r\n")+"\r\n";
}
function parseVcard(data){
 const unfolded=String(data).replace(/\r\n/g,"\n").replace(/\n[ \t]/g,"").split("\n");
 const list=[];let c=null;
 for(const line of unfolded){
  if(/^BEGIN:VCARD$/i.test(line.trim())){c={id:"",name:"",phones:[],email:"",website:"",notes:"",street:"",house:"",zip:"",city:""};continue;}
  if(/^END:VCARD$/i.test(line.trim())){if(c?.name){const item=valid(c);if(item)list.push(item);}c=null;continue;}
  if(!c)continue;
  const pos=line.indexOf(":");if(pos<0)continue;
  const header=line.slice(0,pos).toUpperCase(),type=header.split(";")[0].split(".").pop(),value=vUnescape(line.slice(pos+1));
  if(type==="FN")c.name=value.slice(0,110);
  else if(type==="N"&&!c.name){const names=value.split(";");c.name=[names[1],names[0]].filter(Boolean).join(" ");}
  else if(type==="UID")c.id=value.slice(0,90);
  else if(type==="TEL"){const label=/CELL|IPHONE|MOBILE/.test(header)?"Mobil":/WORK/.test(header)?"Arbeit":/HOME/.test(header)?"Privat":"Andere";c.phones.push({label,number:value.replace(/^tel:/i,"")});}
  else if(type==="EMAIL"&&!c.email)c.email=value;
  else if(type==="URL"&&!c.website)c.website=value;
  else if(type==="NOTE"&&!c.notes)c.notes=value;
  else if(type==="ADR"){
   const v=line.slice(pos+1).split(";").map(vUnescape),street=v[2]||"";
   c.city=v[3]||"";c.zip=v[5]||"";
   const m=street.match(/^(.*?)\s+(\d+[a-zA-Z]?(?:\s*[-/]\s*\d+[a-zA-Z]?)?)$/);
   c.street=m?m[1]:street;c.house=m?m[2]:"";
  }
 }
 return list;
}
function reqPromise(req){return new Promise((ok,no)=>{req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error);});}
async function initStorage(){
 try{demoHidden=localStorage.getItem(DEMO_KEY)==="1";}catch(_){}
 try{
  if(!("indexedDB" in window))throw Error("IndexedDB fehlt");
  db=await new Promise((ok,no)=>{
   const r=indexedDB.open(DB_NAME,1);
   r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:"id"});};
   r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);
   r.onblocked=()=>no(Error("Datenbank gesperrt"));
  });
  const tx=db.transaction(STORE,"readonly");
  records=(await reqPromise(tx.objectStore(STORE).getAll())).map(valid).filter(Boolean);
  if(!records.length){try{for(const c of JSON.parse(localStorage.getItem(KEY)||"[]").map(valid).filter(Boolean))await put(c);}catch(_){}}
  storage="IndexedDB";
 }catch(e){
  db=null;
  try{records=JSON.parse(localStorage.getItem(KEY)||"[]").map(valid).filter(Boolean);localStorage.setItem(KEY,JSON.stringify(records));storage="Browser-Lokalspeicher";}
  catch(_){records=[];storage="nicht verfügbar";}
 }
}
async function put(c){
 if(db){await new Promise((ok,no)=>{const t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(c);t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error);});}
 else if(storage==="Browser-Lokalspeicher"){localStorage.setItem(KEY,JSON.stringify([...records.filter(x=>x.id!==c.id),c]));}
 else throw Error("Lokale Speicherung nicht verfügbar");
 records=[...records.filter(x=>x.id!==c.id),c];
}
async function erase(id){
 if(db){await new Promise((ok,no)=>{const t=db.transaction(STORE,"readwrite");t.objectStore(STORE).delete(id);t.oncomplete=ok;t.onerror=()=>no(t.error);});}
 else if(storage==="Browser-Lokalspeicher"){localStorage.setItem(KEY,JSON.stringify(records.filter(x=>x.id!==id)));}
 else throw Error("Lokale Speicherung nicht verfügbar");
 records=records.filter(x=>x.id!==id);
}
async function eraseAll(){
 if(db){await new Promise((ok,no)=>{const t=db.transaction(STORE,"readwrite");t.objectStore(STORE).clear();t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error);});}
 else if(storage!=="Browser-Lokalspeicher")throw Error("Lokale Speicherung nicht verfügbar");
 localStorage.setItem(KEY,"[]");
 records=[];
}
const digits={"0":"null","1":"eins","2":"zwei","3":"drei","4":"vier","5":"fünf","6":"sechs","7":"sieben","8":"acht","9":"neun"};
const units=["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
const tens=["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
function word(n){
 n=Number(n);
 if(!Number.isInteger(n)||n<0||n>99999)return String(n);
 if(n<20)return units[n];
 if(n<100){const t=Math.floor(n/10),r=n%10;return r?(r===1?"ein":units[r])+"und"+tens[t]:tens[t];}
 if(n<1000){const h=Math.floor(n/100),r=n%100;return (h===1?"ein":word(h))+"hundert"+(r?word(r):"");}
 const t=Math.floor(n/1000),r=n%1000;
 return (t===1?"ein":word(t))+"tausend"+(r?word(r):"");
}
function houseVoice(s){return String(s).replace(/(\d{1,5})([a-zA-Z]?)/g,(_,n,l)=>word(parseInt(n,10))+(l?" "+l:"")).replace(/\s*[-–]\s*/g," bis ").replace(/\s*\/\s*/g," Schrägstrich ");}
function digitVoice(s,group=5){const v=(String(s).match(/\d/g)||[]).map(x=>digits[x]);let result=[];for(let i=0;i<v.length;i+=group)result.push(v.slice(i,i+group).join(", "));return result.join(". "); }
function addressText(c){return [c.street+(c.house?" "+c.house:""),[c.zip,c.city].filter(Boolean).join(" ")].filter(x=>x.trim()).join("\n");}
function spoken(c,section="all"){
 const name=c.name.replace(" (Beispiel)","");
 const s=[c.street,houseVoice(c.house)].filter(Boolean).join(" ");
 const address=["Die Adresse von "+name+" lautet:",s?s+".":"",c.zip?"Postleitzahl: "+digitVoice(c.zip)+".":"",c.city?"Ort: "+c.city+".":""].filter(Boolean).join(" ");
 const p=phoneList(c);
 const phones="Telefonnummern von "+name+": "+p.map(x=>x.label+": "+(x.number.trim().startsWith("+")?"plus ":"")+digitVoice(x.number,4)+".").join(" ");
 if(section==="address")return address;
 if(section==="phones")return p.length?phones:"Für "+name+" ist keine Telefonnummer gespeichert.";
 return ["Kontakt "+name+".",address,p.length?phones:""] .filter(Boolean).join(" ");
}
function phoneField(p){
 const n=++phoneSeed;
 const label=p?.label||"Mobil",number=p?.number||"";
 const opts=["Mobil","Privat","Arbeit","Andere"].map(x=>'<option value="'+x+'"'+(x===label?' selected':'')+'>'+x+'</option>').join("");
 return '<div class="phoneentry" data-phone-entry><div class="row equal"><div><label for="label-'+n+'">Art</label><select id="label-'+n+'" name="phoneType">'+opts+'</select></div><div><label for="num-'+n+'">Telefonnummer</label><input id="num-'+n+'" type="tel" name="phoneNumber" autocomplete="off" maxlength="70" value="'+E(number)+'"></div></div><button type="button" class="quiet smaller" data-a="remove-phone">Diese Nummer entfernen</button></div>';
}
function phoneCards(c){
 const list=phoneList(c);
 return list.length?list.map((p,i)=>'<section class="phonebox"><div class="phonebox-label">'+E(p.label)+'</div><div class="phonebox-number">'+E(p.number)+'</div>'+(c.demo?'':'<button type="button" class="call-btn" data-a="call" data-index="'+i+'" aria-label="'+E(c.name+': '+p.label+' '+p.number+' anrufen')+'">Anrufen</button>')+'</section>').join(""):'<div class="value">Keine Telefonnummer hinterlegt</div>';
}
function contactCard(c){
 const phones=phoneList(c);
 const telephone=phones.length?phones.map((p,i)=>'<div class="contact-card-phone"><div class="contact-card-label">'+E(p.label)+'</div><div class="contact-card-number">'+E(p.number)+'</div>'+(c.demo?'':'<button type="button" class="call-btn" data-a="call" data-index="'+i+'" aria-label="'+E(c.name+': '+p.label+' '+p.number+' anrufen')+'">Anrufen</button>')+'</div>').join(""):'<div class="contact-card-phone"><div class="contact-card-number">Keine Telefonnummer hinterlegt</div></div>';
 return '<section class="contact-card" aria-label="Kontakt von '+E(c.name)+'"><div class="contact-card-name">'+E(c.name)+'</div><div class="contact-card-address">'+E(addressText(c)||"Keine Adresse hinterlegt")+'</div><div class="contact-card-heading">Telefonnummern</div>'+telephone+'</section>';
}
function extra(c){
 if(!c.email&&!c.website&&!c.notes)return "";
 const site=safeSite(c.website);
 return '<details class="aux"><summary>Weitere Angaben</summary>'+(c.email?'<p><span class="fieldhead">E-Mail</span><br><a href="mailto:'+encodeURIComponent(c.email)+'">'+E(c.email)+'</a></p>':'')+(c.website?'<p><span class="fieldhead">Webseite</span><br>'+(site?'<a href="'+E(site)+'" target="_blank" rel="noopener noreferrer">'+E(c.website)+'</a>':E(c.website))+'</p>':'')+(c.notes?'<p><span class="fieldhead">Notizen</span><br><span class="notes">'+E(c.notes)+'</span></p>':'')+'</details>';
}
function speak(text){
 try{
  if(!("speechSynthesis" in window)){status("Sprachausgabe ist hier nicht verfügbar.");return;}
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);utterance.lang="de-DE";utterance.rate=.83;
  const voices=speechSynthesis.getVoices(),german=voices.find(x=>x.lang.toLowerCase()==="de-de")||voices.find(x=>x.lang.toLowerCase().startsWith("de"));
  if(german)utterance.voice=german;
  utterance.onerror=()=>status("Die Sprachausgabe wurde vom Browser nicht ausgeführt.");
  speechSynthesis.speak(utterance);
 }catch(e){status("Die Sprachausgabe ist fehlgeschlagen.");}
}
function stopSpeaking(){
 try{if("speechSynthesis" in window)speechSynthesis.cancel();status("Vorlesen gestoppt.");}
 catch(e){status("Vorlesen konnte nicht gestoppt werden.");}
}
function status(txt){message=txt;const el=app.querySelector("#status");if(el)el.textContent=message;}
async function provideFile(blob,filename,title){
 const file=typeof File!=="undefined"?new File([blob],filename,{type:blob.type}):null;
 if(file&&navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
  try{await navigator.share({title,files:[file]});status("Sicherung bereitgestellt. In der Freigabe bitte „In Dateien sichern“ oder pCloud wählen.");return;}
  catch(err){if(err?.name==="AbortError"){status("Sicherung nicht abgelegt.");return;}}
 }
 const uri=URL.createObjectURL(blob),link=document.createElement("a");
 link.href=uri;link.download=filename;
 document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(uri),5000);
 status("Datei bereitgestellt – bitte in Dateien sichern.");
}
function appPackageName(){return PROFILE.id==="klaus"?"klaus-kontakte-app-paket.zip":PROFILE.id==="jan"?"jan-kontakte-app-paket.zip":"kontakte-app-paket.zip";}
async function shareAppPackage(){
 try{
  const filename=appPackageName(),response=await fetch("./"+filename,{cache:"no-store"});
  if(!response.ok)throw Error("App-Paket ist noch nicht verfügbar.");
  await provideFile(await response.blob(),filename,"Kontakte-App-Paket mit Quellcode");
 }catch(err){status("App-Paket konnte nicht bereitgestellt werden: "+err.message);}
}
function voiceQuery(text){
 return N(text).replace(/[.,!?]/g," ").replace(/\b(wie|lautet|ist|mir|bitte|den|die|das|kontakt|von|fuer|für|suche|zeige|offne|oeffne|adresse|anschrift|telefonnummer|telefon|nummer|rufe|rufen|anrufen|lies|vor|auf|dem|handy|mobil|an|frau|herr|herrn)\b/g," ").replace(/\s+/g," ").trim();
}
function runVoiceCommand(text){
 const raw=String(text||"").trim(),command=N(raw),query=voiceQuery(raw);
 if(!raw){status("Bitte einen Namen oder Sprachbefehl eingeben.");return;}
 if(command==="hilfe"){
  const help="Sagen Sie zum Beispiel: Suche Anna Müller. Adresse Anna Müller. Telefonnummer Anna Müller. Oder: Rufe Anna Müller.";
  status(help);speak(help);return;
 }
 if(!query){status("Name nicht verstanden. Sagen Sie zum Beispiel: Suche Anna Müller.");return;}
 const found=all().filter(c=>fuzzyNameMatches(c.name,query));
 if(!found.length){term=query;view="list";render();status("Kein Kontakt mit diesem Namen gefunden.");return;}
 if(found.length>1){term=query;view="list";render();status(found.length+" Kontakte gefunden. Bitte Kontakt auswählen.");return;}
 const c=found[0];selected=c.id;view="detail";render();
 if(/\b(adresse|anschrift)\b/.test(command)){speak(spoken(c,"address"));return;}
 if(/\b(telefonnummer|telefon|nummer)\b/.test(command)){speak(spoken(c,"phones"));return;}
 if(/\b(rufe|rufen|anrufen)\b/.test(command)){status("Kontaktkarte geöffnet. Bitte die gewünschte Nummer prüfen und „Anrufen“ bestätigen.");return;}
 status("Kontaktkarte von "+c.name+" geöffnet.");
}
async function startBrowserVoice(targetId="voice-command"){
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition,isSearch=targetId==="q";
 const input=()=>app.querySelector("#"+targetId);
 const fallback=()=>{status(isSearch?"Direkte Sprachsuche ist hier nicht verfügbar. Bitte den Namen sprechen oder eingeben.":"Direkte Browser-Spracherkennung ist hier nicht verfügbar. Bitte das Mikrofon der iPhone-Tastatur im Befehlsfeld verwenden.");input()?.focus();};
 if(!Recognition){fallback();return;}
 try{
  if(navigator.mediaDevices?.getUserMedia){
   status("Mikrofon wird aktiviert.");
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   stream.getTracks().forEach(track=>track.stop());
  }
  const recognition=new Recognition();recognition.lang="de-DE";recognition.interimResults=false;recognition.maxAlternatives=1;
  recognition.onstart=()=>status(isSearch?"Ich höre zu. Sprechen Sie den Namen.":"Ich höre zu. Sprechen Sie Ihren Befehl.");
  recognition.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript||"",field=input();if(field)field.value=text;if(isSearch){letter="";term=text;const list=app.querySelector("#list");if(list)list.innerHTML=items();status("Suche nach "+text+".");}else runVoiceCommand(text);};
  recognition.onerror=fallback;
  recognition.start();
 }catch(err){fallback();}
}
const logo='<svg aria-hidden="true" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#000"/><circle cx="50" cy="50" r="35" fill="#fff"/><circle cx="50" cy="50" r="9" fill="#000"/></svg>';
const back='<button class="back" data-a="back" aria-label="Zur Startseite">Zur Startseite</button>';
function screen(inner){app.innerHTML='<main class="main">'+inner+'<div id="status" role="status" aria-live="polite">'+E(message)+'</div></main>';}
function items(){
 const match=all().filter(c=>(!letter||N(c.name).startsWith(N(letter)))&&fuzzyNameMatches(c.name,term));
 return match.length?match.map(c=>{const info=[addressText(c),phoneList(c).map(p=>p.label+": "+p.number).join("\n")].filter(Boolean).join("\n");return '<button class="item" data-a="select" data-id="'+E(c.id)+'"><span class="item-title">'+E(c.name)+'</span><span class="item-detail">'+E(info||"Keine Adresse oder Telefonnummer hinterlegt")+'</span></button>';}).join(""):'<p class="muted">Kein Kontakt gefunden.</p>';
}
function alphabetPicker(){
 const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
 return '<section class="alphabet" aria-label="Anfangsbuchstabe wählen"><div class="alphabet-grid"><button class="allletters" data-a="letter" data-letter="">Alle</button>'+letters.map(x=>'<button data-a="letter" data-letter="'+x+'" aria-label="Kontakte mit '+x+' anzeigen">'+x+'</button>').join("")+'</div></section>';
}
function render(){
 if(view==="home"){
  app.innerHTML='<main class="main home"><div class="brand"><button class="logo" data-a="voice" aria-label="Sprachsteuerung starten">'+logo+'</button><h1>'+E(PROFILE.title)+'</h1></div><button class="large" data-a="contacts">Kontakte öffnen</button><button class="new" data-a="new">Neuer Kontakt</button><p class="foot">Punkt antippen: Sprachsteuerung · Beim Speichern bleiben Kontakte lokal auf diesem iPhone.</p><div id="status" role="status" aria-live="polite">'+E(message)+'</div></main>';return;
 }
 if(view==="voice"){
  screen(back+'<h2>Kontakt sprechen</h2><p class="muted">Sprechen Sie nur den Namen.</p><input id="voice-command" type="text" inputmode="text" autocomplete="off" placeholder="Sprechen" aria-label="Kontakt sprechen"><button class="primary" data-a="listen">Erneut sprechen</button><button class="outline" data-a="stop-speaking">Vorlesen stoppen</button>');return;
 }
 if(view==="list"){
  const search=searchOpen?'<input class="search-card" id="q" type="search" autocomplete="name" placeholder="Sprechen" value="'+E(term)+'" aria-label="Kontakt suchen">':'<button class="search-card" data-a="search-voice" aria-label="Suche">Suche</button>';
  const alphabet=alphabetOpen?alphabetPicker():'<button class="outline" data-a="alphabet">A–Z</button>';
  screen(back+'<h2>Kontakte</h2>'+search+alphabet+'<div id="list">'+items()+'</div>');return;
 }
 if(view==="detail"){
  const c=get(selected);if(!c){view="list";render();return;}
  const controls='<button class="primary" data-a="speak">Kontakt vollständig vorlesen</button><button class="outline" data-a="stop-speaking">Vorlesen stoppen</button><button class="outline" data-a="search-again">Anderen Kontakt suchen</button>'+(c.demo?'':'<button class="outline" data-a="favorite">'+(c.favorite?'Aus Favoriten entfernen':'Zu Favoriten')+'</button>');
  screen(back+contactCard(c)+controls+extra(c)+(c.demo?'<p class="tip">Beispielkontakt. Er kann gelöscht werden.</p><button class="outline" data-a="delete">Beispielkontakt löschen</button>':'<button class="quiet" data-a="edit">Kontakt bearbeiten</button><button class="outline" data-a="delete">Kontakt löschen</button>'));return;
 }
 if(view==="form"){
  const c=editing?get(editing):null,v=c||{name:"",phone:"",phones:[],street:"",house:"",zip:"",city:"",email:"",website:"",notes:""};
  const numbers=phoneList(v);
  const fields=(numbers.length?numbers:[{label:"Mobil",number:""}]).map(phoneField).join("");
  screen(back+'<h2>'+(editing?"Kontakt bearbeiten":"Neuer Kontakt")+'</h2><p class="tip">Der Kontakt wird mit „Kontakt lokal speichern“ am Ende dieses Formulars auf diesem iPhone abgelegt.</p><form id="form"><label for="name">Name</label><input id="name" name="name" maxlength="110" required autocomplete="name" value="'+E(v.name)+'"><p class="tip">Telefonnummern</p><div id="phone-fields">'+fields+'</div><button class="add-phone" type="button" data-a="add-phone">+ Weitere Telefonnummer</button><label for="website">Webseite</label><input id="website" name="website" type="text" inputmode="text" maxlength="250" autocomplete="url" placeholder="www.beispiel.de" value="'+E(v.website)+'"><label for="email">E-Mail-Adresse</label><input id="email" type="email" name="email" autocomplete="email" maxlength="180" value="'+E(v.email)+'"><div class="row"><div><label for="street">Straße</label><input id="street" name="street" maxlength="120" autocomplete="address-line1" value="'+E(v.street)+'"></div><div><label for="house">Hausnummer</label><input id="house" name="house" maxlength="22" value="'+E(v.house)+'"></div></div><div class="row equal"><div><label for="zip">Postleitzahl</label><input id="zip" name="zip" inputmode="numeric" maxlength="16" autocomplete="postal-code" value="'+E(v.zip)+'"></div><div><label for="city">Ort</label><input id="city" name="city" maxlength="100" autocomplete="address-level2" value="'+E(v.city)+'"></div></div><label for="notes">Kommentare / Notizen</label><textarea id="notes" name="notes" maxlength="4000" rows="4">'+E(v.notes)+'</textarea><p class="tip">Zum Diktieren ein Eingabefeld und anschließend das Mikrofon der iPhone-Tastatur antippen.</p><button class="primary" type="submit">Kontakt lokal speichern</button></form>'+(editing?'<button class="quiet" data-a="delete">Kontakt löschen</button>':'')+'<section class="backup" aria-label="Kontakte sichern, importieren und exportieren"><h3>Sicherung und Übertragung</h3><p class="backup-note">Der laufende Kontaktbestand bleibt lokal auf diesem iPhone. Eine Sicherung wird als eigene Datei bereitgestellt; sie wird nicht automatisch in pCloud abgelegt.</p><button data-a="export-pcloud" type="button">In pCloud sichern · Teilen</button><button data-a="export-json" type="button">Sicherung in Dateien speichern (JSON)</button><button data-a="export-vcf" type="button">Kontakte als vCard exportieren</button><button data-a="import" type="button">Kontakte importieren (VCF oder JSON)</button><input id="importfile" type="file" accept=".vcf,text/vcard,.json,application/json" hidden aria-label="Kontaktdatei auswählen"><button data-a="delete-all" type="button">Alle eigenen Kontakte löschen</button></section><p class="backup-note">Speicher: '+E(storage)+'. Beim Löschen der App oder Website-Daten können die Kontakte verloren gehen.</p>');
  app.querySelector(".backup")?.insertAdjacentHTML("beforeend",'<button data-a="download-app" type="button">App-Paket mit Quellcode sichern</button>');
  return;
 }

}
function nav(to){view=to;message="";render();}
app.addEventListener("input",e=>{
 if(e.target.id==="q"){term=e.target.value;letter="";const list=app.querySelector("#list");if(list)list.innerHTML=items();return;}
 if(e.target.id==="voice-command"){
  clearTimeout(voiceTimer);
  const command=String(e.target.value||"").trim();
  if(command.length<3)return;
  voiceTimer=setTimeout(()=>runVoiceCommand(command),900);
 }
});
app.addEventListener("click",async e=>{
 const b=e.target.closest("button[data-a]");if(!b)return;
 const a=b.dataset.a;
 if(a==="voice"){nav("voice");startBrowserVoice();return;}
 if(a==="listen"){startBrowserVoice();return;}
 if(a==="voice-run"){runVoiceCommand(app.querySelector("#voice-command")?.value);return;}
 if(a==="voice-help"){runVoiceCommand("hilfe");return;}
 if(a==="stop-speaking"){stopSpeaking();return;}
 if(a==="contacts"||a==="address"||a==="phone"){mode="contact";term="";letter="";alphabetOpen=false;selected=null;searchOpen=false;nav("list");return;}
 if(a==="search-voice"){letter="";alphabetOpen=false;searchOpen=true;render();startBrowserVoice("q");return;}
 if(a==="search-again"){selected=null;term="";letter="";alphabetOpen=false;searchOpen=true;nav("list");startBrowserVoice("q");return;}
 if(a==="alphabet"){alphabetOpen=!alphabetOpen;render();return;}
 if(a==="letter"){letter=b.dataset.letter||"";term="";alphabetOpen=false;render();status(letter?"Kontakte mit "+letter+".":"Alle Kontakte.");return;}
 if(a==="new"){editing=null;nav("form");return;}
 if(a==="back"){selected=null;editing=null;term="";nav("home");return;}
 if(a==="select"){
  selected=b.dataset.id;nav("detail");
  return;
 }
 if(a==="speak"||a==="speak-address"||a==="speak-phones"){const c=get(selected);if(!c)return;
  const section=a==="speak-address"?"address":a==="speak-phones"?"phones":"all";
  if(section==="address"&&!addressText(c)){status("Für diesen Kontakt ist keine Adresse gespeichert.");return;}
  if(section==="phones"&&!phoneList(c).length){status("Für diesen Kontakt ist keine Telefonnummer gespeichert.");return;}
  speak(spoken(c,section));return;
 }
 if(a==="call"){
  const c=get(selected);if(!c||c.demo)return;
  const i=Number(b.dataset.index),entry=phoneList(c)[i];
  if(!entry){status("Keine Telefonnummer ausgewählt.");return;}
  const phone=entry.number.replace(/[^0-9+]/g,"").replace(/(?!^)\+/g,"");
  if(phone.replace(/\D/g,"").length<3){status("Keine gültige Telefonnummer hinterlegt.");return;}
  if(confirm(c.name+" – "+entry.label+" ("+entry.number+") jetzt anrufen?"))location.href="tel:"+phone;
  return;
 }
 if(a==="add-phone"){
  const node=app.querySelector("#phone-fields");
  if(node?.querySelectorAll("[data-phone-entry]").length>=30){status("Maximal 30 Telefonnummern je Kontakt.");return;}
  node?.insertAdjacentHTML("beforeend",phoneField({label:"Mobil",number:""}));
  node?.lastElementChild?.querySelector('input[name="phoneNumber"]')?.focus();
  return;
 }
 if(a==="remove-phone"){
  const node=b.closest("[data-phone-entry]");node?.remove();
  if(!app.querySelector("#phone-fields")?.querySelector("[data-phone-entry]")){
   app.querySelector("#phone-fields")?.insertAdjacentHTML("beforeend",phoneField({label:"Mobil",number:""}));
  }
  return;
 }
 if(a==="favorite"){
  const c=get(selected);if(!c||c.demo)return;
  const nowFavorite=!c.favorite;
  try{await put({...c,favorite:nowFavorite,updatedAt:stamp()});render();status(nowFavorite?c.name+" ist jetzt ein Favorit.":c.name+" ist kein Favorit mehr.");}
  catch(err){status("Favorit konnte nicht gespeichert werden.");}
  return;
 }
 if(a==="edit"){editing=selected;nav("form");return;}
 if(a==="delete"){
  const targetId=editing||selected,c=get(targetId);
  if(!targetId||!c||!confirm((c.name||"Dieser Kontakt")+" wird unwiderruflich gelöscht. Fortfahren?"))return;
  if(c.demo){
   try{demoHidden=true;localStorage.setItem(DEMO_KEY,"1");editing=null;selected=null;nav("home");status("Beispielkontakt gelöscht.");}catch(err){status("Löschen fehlgeschlagen.");}
   return;
  }
  try{await erase(targetId);editing=null;selected=null;nav("home");status("Kontakt gelöscht.");}catch(err){status("Löschen fehlgeschlagen.");}return;
 }
 if(a==="delete-all"){
  const count=records.length;
  if(!count){status("Es sind keine eigenen Kontakte gespeichert.");return;}
  if(!confirm("Wirklich alle "+count+" eigenen Kontakte aus "+PROFILE.title+" löschen? Der Beispielkontakt bleibt erhalten."))return;
  if(!confirm("Letzte Sicherheitsfrage: "+count+" Kontakte werden unwiderruflich gelöscht. Fortfahren?")){status("Löschen abgebrochen. Es wurde nichts verändert.");return;}
  try{await eraseAll();editing=null;selected=null;nav("home");status(count+" Kontakte gelöscht.");}catch(err){status("Löschen fehlgeschlagen.");}return;
 }
 if(a==="export-vcf"||a==="export-json"||a==="export-pcloud"){
  const today=new Date().toISOString().slice(0,10);
  const vcard=a==="export-vcf",blob=new Blob([
   vcard?toVcard(records):JSON.stringify({application:"Kontakte",version:2,exportedAt:stamp(),contacts:records},null,2)
  ],{type:vcard?"text/vcard;charset=utf-8":"application/json"});
  const filename=PROFILE.id+"-kontakte-"+today+(vcard?".vcf":".json");
  await provideFile(blob,filename,a==="export-pcloud"?"Kontakte-Sicherung für pCloud":"Kontakte-Sicherung");return;
 }
 if(a==="download-app"){await shareAppPackage();return;}
 if(a==="import"){app.querySelector("#importfile")?.click();return;}
});
app.addEventListener("submit",async e=>{
 if(e.target.id!=="form")return;
 e.preventDefault();
 const f=new FormData(e.target);
 const field=n=>String(f.get(n)||"").trim();
 const labels=f.getAll("phoneType"),values=f.getAll("phoneNumber");
 const phones=values.map((v,i)=>({label:String(labels[i]||"Mobil"),number:String(v||"").trim()})).filter(p=>p.number).slice(0,30);
 const data=valid({id:editing||"k-"+newId(),name:field("name"),phone:phones[0]?.number||"",phones,street:field("street"),house:field("house"),zip:field("zip"),city:field("city"),email:field("email"),website:field("website"),notes:field("notes"),favorite:editing?get(editing)?.favorite===true:false,updatedAt:stamp()});
 if(!data){status("Bitte Namen eingeben.");return;}
 try{await put(data);editing=null;selected=null;nav("home");status("Kontakt lokal gespeichert · "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr.");}
 catch(err){status("Konnte nicht gespeichert werden. Bitte Browserspeicher prüfen.");}
});
app.addEventListener("change",async e=>{
 if(e.target.id!=="importfile"||!e.target.files?.[0])return;
 try{
  const file=e.target.files[0];if(file.size>3000000)throw Error("Datei zu groß (maximal 3 MB).");
  const raw=await file.text(),vcf=/\.vcf$/i.test(file.name)||/^\s*BEGIN:VCARD/i.test(raw);
  const obj=vcf?parseVcard(raw):JSON.parse(raw);
  const list=vcf?obj:(Array.isArray(obj)?obj:obj.contacts);
  if(!Array.isArray(list))throw Error("Unbekanntes Kontaktformat.");
  const plan=importPlan(list),preview=plan.add.slice(0,3).map(c=>c.name).join(", ");
  if(!plan.add.length){status("Import geprüft: keine neuen Kontakte. "+plan.duplicates+" vorhandene und "+plan.invalid+" unvollständige Einträge wurden nicht verändert.");return;}
  const limit=plan.limited?" Es werden höchstens 3.000 Einträge verarbeitet.":"";
  if(!confirm("Import-Vorschau: "+plan.add.length+" neue Kontakte"+(preview?" (zum Beispiel: "+preview+")":"")+". "+plan.duplicates+" vorhandene und "+plan.invalid+" unvollständige Einträge werden übersprungen. Es wird nichts überschrieben oder gelöscht."+limit+" Jetzt importieren?")){status("Import abgebrochen. Es wurde nichts verändert.");return;}
  for(const c of plan.add)await put(c);
  status(plan.add.length+" Kontakte importiert, "+plan.duplicates+" vorhandene und "+plan.invalid+" unvollständige Einträge übersprungen. Keine Daten überschrieben.");
 }catch(err){status("Import fehlgeschlagen: "+err.message);}
 finally{e.target.value="";}
});
(async()=>{await initStorage();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{});render();})();
})();
